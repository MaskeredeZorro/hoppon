<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opret Profil | HoppOn</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --brand: #4F46E5; --brand-dark: #4338ca; --dark: #0F172A; --light: #F8FAFC; --text: #334155; --text-light: #64748B; --success: #10B981; --error: #EF4444; --border: #E2E8F0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background-color: #F3F4F6; color: var(--dark); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
        
        .card { background: white; width: 100%; max-width: 450px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 2.5rem; }
        h1 { font-size: 1.8rem; text-align: center; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: var(--text-light); margin-bottom: 2rem; font-size: 0.9rem; }

        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 12px; font-size: 1rem; background: var(--light); outline: none; transition: 0.2s; }
        input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        /* Avatar */
        .avatar-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 1.5rem; cursor: pointer; }
        .avatar-preview { width: 90px; height: 90px; border-radius: 50%; background: #E2E8F0; border: 2px dashed #CBD5E1; display: flex; justify-content: center; align-items: center; overflow: hidden; margin-bottom: 8px; }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }

        /* Driver Toggle */
        .driver-box { background: #EEF2FF; border: 1px solid #C7D2FE; padding: 1rem; border-radius: 12px; margin: 1.5rem 0; display: flex; justify-content: space-between; align-items: center; }
        .switch { position: relative; width: 44px; height: 24px; cursor: pointer; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: var(--brand); }
        input:checked + .slider:before { transform: translateX(20px); }

        #carFields { display: none; border-top: 1px solid var(--border); padding-top: 1rem; }
        .plate-row { display: flex; gap: 10px; }
        .btn-lookup { background: var(--dark); color: white; border: none; padding: 0 15px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }

        /* Flot Bil-visning */
        #carBadge { display: none; background: #F0FDF4; border: 1px solid #BBF7D0; padding: 12px; border-radius: 14px; margin-top: 12px; align-items: center; gap: 12px; }
        .car-icon { background: #DCFCE7; padding: 8px; border-radius: 10px; font-size: 1.2rem; }
        .car-info { flex: 1; }
        .car-name { font-weight: 700; color: #166534; font-size: 0.95rem; display: block; }
        .car-details { font-size: 0.75rem; color: #15803d; }
        
        .btn-main { width: 100%; padding: 16px; background: var(--brand); color: white; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 1rem; transition: 0.2s; }
        .btn-main:hover { background: var(--brand-dark); transform: translateY(-1px); }
        .btn-main:disabled { background: #A5B4FC; cursor: not-allowed; }
        
        #statusMsg { text-align: center; margin-top: 1rem; font-size: 0.9rem; font-weight: 600; transition: 0.3s; }
    </style>
</head>
<body>

<div class="card">
    <h1>Opret Profil</h1>
    <p class="subtitle">Velkommen til HoppOn 🚀</p>

    <div class="avatar-section" onclick="document.getElementById('avatarFile').click()">
        <div class="avatar-preview">
            <img id="previewImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='%23CBD5E1' viewBox='0 0 24 24'%3E%3Cpath d='M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z' /%3E%3C/svg%3E">
        </div>
        <span style="color: var(--brand); font-size: 0.8rem; font-weight: 600;">Upload profilbillede *</span>
        <input type="file" id="avatarFile" accept="image/*" style="display:none" onchange="previewAvatar()">
    </div>

    <div class="form-group">
        <label>Fulde Navn *</label>
        <input type="text" id="regName" placeholder="Mette Jensen">
    </div>

    <div class="form-group">
        <label>Email *</label>
        <input type="email" id="regEmail" placeholder="mette@example.com">
    </div>

    <div class="form-group">
        <label>Adgangskode *</label>
        <input type="password" id="regPass" placeholder="Mindst 6 tegn">
    </div>

    <div style="display: flex; gap: 15px;">
        <div class="form-group" style="flex: 1.2;">
            <label>Fødselsdato *</label>
            <input type="date" id="regDob">
        </div>
        <div class="form-group" style="flex: 0.8;">
            <label>Køn *</label>
            <select id="regGender">
                <option value="Mand">Mand</option>
                <option value="Kvinde">Kvinde</option>
                <option value="Andet">Andet</option>
            </select>
        </div>
    </div>

    <div class="driver-box">
        <span style="font-weight: 600; color: var(--brand-dark);">Jeg vil være chauffør</span>
        <label class="switch">
            <input type="checkbox" id="isDriver" onchange="toggleDriver()">
            <span class="slider"></span>
        </label>
    </div>

    <div id="carFields">
        <div class="form-group">
            <label>Telefonnummer *</label>
            <input type="tel" id="regPhone" placeholder="12 34 56 78">
        </div>
        <div class="form-group">
            <label>Nummerplade</label>
            <div class="plate-row">
                <input type="text" id="plateInput" placeholder="AB 12 345" style="text-transform: uppercase;">
                <button class="btn-lookup" onclick="lookupPlate()">Søg bil</button>
            </div>
            
            <div id="carBadge">
                <div class="car-icon">🚗</div>
                <div class="car-info">
                    <span class="car-name" id="displayCarName">Audi Q3</span>
                    <span class="car-details" id="displayCarMeta">2021 • Sort • AB 12 345</span>
                </div>
            </div>
            <div id="plateError" style="font-size: 0.8rem; margin-top: 8px; color: var(--error); display: none;"></div>
        </div>
    </div>

    <button class="btn-main" id="submitBtn" onclick="handleSignup()">Opret Konto</button>
    <div id="statusMsg"></div>

    <input type="hidden" id="carMake">
    <input type="hidden" id="carModel">
</div>

<script>
    const _supabase = supabase.createClient('https://xboklywxcozobvfrptpr.supabase.co', 'sb_publishable_amqWmR5MrUSFHlniU2yp3Q_c8kUysEY');

    function previewAvatar() {
        const file = document.getElementById('avatarFile').files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById('previewImg').src = e.target.result;
            reader.readAsDataURL(file);
        }
    }

    function toggleDriver() {
        document.getElementById('carFields').style.display = document.getElementById('isDriver').checked ? 'block' : 'none';
    }

    async function lookupPlate() {
        const plateInput = document.getElementById('plateInput');
        const plate = plateInput.value.trim();
        const badge = document.getElementById('carBadge');
        const err = document.getElementById('plateError');
        
        if (!plate) return;

        err.style.display = "none";
        badge.style.display = "none";

        const { data, error } = await _supabase.rpc('get_car_details', { plate_text: plate.replace(/\s/g, '') });

        if (data && !data.error && data.make) {
            document.getElementById('displayCarName').innerText = `${data.make} ${data.model}`;
            document.getElementById('displayCarMeta').innerText = `${data.model_year || ''} • ${data.color || ''} • ${plate.toUpperCase()}`;
            
            document.getElementById('carMake').value = data.make;
            document.getElementById('carModel').value = data.model;
            
            badge.style.display = "flex";
        } else {
            err.innerText = "❌ Vi kunne ikke finde bilen. Tjek nummerpladen.";
            err.style.display = "block";
        }
    }

    async function handleSignup() {
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('statusMsg');
        
        const email = document.getElementById('regEmail').value.trim();
        const pass = document.getElementById('regPass').value;
        const name = document.getElementById('regName').value.trim();
        const dob = document.getElementById('regDob').value;
        const gender = document.getElementById('regGender').value;
        const isDriver = document.getElementById('isDriver').checked;
        const phone = document.getElementById('regPhone').value.trim();
        const plate = document.getElementById('plateInput').value.trim();
        const avatarFile = document.getElementById('avatarFile').files[0];

        if (!email || !pass || !name || !avatarFile) {
            alert("Husk at udfylde navn, email, password og vælge et billede.");
            return;
        }

        btn.disabled = true;
        msg.style.color = "var(--text)";
        msg.innerText = "Vent et øjeblik... 🛠️";

        try {
            // 1. Upload Avatar
            const fileName = `${Date.now()}_${avatarFile.name.replace(/\s/g, '_')}`;
            const { error: upErr } = await _supabase.storage.from('avatars').upload(fileName, avatarFile);
            if (upErr) throw upErr;
            const { data: urlData } = _supabase.storage.from('avatars').getPublicUrl(fileName);

            // 2. Car Details String
            const make = document.getElementById('carMake').value;
            const model = document.getElementById('carModel').value;
            const carDetailsStr = isDriver ? `${make} ${model} (${plate})` : null;

            // 3. Auth SignUp
            const { error: authErr } = await _supabase.auth.signUp({
                email: email,
                password: pass,
                options: {
                    data: {
                        full_name: name,
                        avatar_url: urlData.publicUrl,
                        gender: gender,
                        birth_date: dob,
                        is_driver: isDriver,
                        phone_number: isDriver ? phone : null,
                        license_plate: isDriver ? plate : null,
                        car_details: carDetailsStr
                    }
                }
            });

            if (authErr) throw authErr;

            // Succes!
            msg.style.color = "var(--success)";
            msg.innerText = "Konto oprettet! Sender dig videre... 🚀";
            
            // Redirect efter 1.5 sekund
            setTimeout(() => {
                window.location.href = 'https://hoppon.dk/login';
            }, 1500);
            
        } catch (e) {
            msg.style.color = "var(--error)";
            msg.innerText = "Ups! " + e.message;
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
