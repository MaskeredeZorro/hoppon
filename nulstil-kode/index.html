<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nulstil adgangskode | HoppOn</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    
    <script src="/supabase.js"></script>
    <script src="/components.js" defer></script>

    <style>
        /* Samme design som login-siden for en rød tråd */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 1rem 2rem 1rem;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 100%;
            max-width: 420px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
            padding: 3rem 2.5rem;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .login-card h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            text-align: center;
            color: var(--brand);
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 1rem;
            background: #F8FAFC;
            color: var(--brand);
            font-weight: 500;
            transition: all 0.2s;
            outline: none;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .message-box {
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 15px;
            text-align: center;
            display: none;
            padding: 12px;
            border-radius: 12px;
        }

        .error-msg { color: #EF4444; background: #FEF2F2; border: 1px solid #FCA5A5; }
        .success-msg { color: #10B981; background: #ECFDF5; border: 1px solid #6EE7B7; }

        .footer-link {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
        }

        /* Loading Overlay Global */
        #globalLoader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); display: none;
            justify-content: center; align-items: center; flex-direction: column; gap: 15px;
            z-index: 2000; backdrop-filter: blur(5px);
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        .loading-text { font-weight: 700; color: var(--brand); font-size: 1.1rem;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body>

    <div id="globalLoader">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Opdaterer kode...</div>
    </div>

    <hoppon-header></hoppon-header>

    <main>
        <div class="login-card">
            <h1>Lav ny kode</h1>
            <p class="subtitle">Indtast din nye adgangskode til HoppOn</p>

            <div class="form-group">
                <label>Ny adgangskode</label>
                <input type="password" id="nyKode" placeholder="Mindst 6 tegn" required>
            </div>

            <div class="form-group">
                <label>Gentag ny adgangskode</label>
                <input type="password" id="bekraeftKode" placeholder="Gentag adgangskode" required>
            </div>

            <div id="statusMessage" class="message-box"></div>

            <button class="btn-submit" onclick="opdaterKode()">Gem ny kode</button>
            
            <div class="footer-link">
                <a href="/login">Annuller og gå til log ind</a>
            </div>
        </div>
    </main>

    <hoppon-footer></hoppon-footer>

    <script>
        function setLoading(isLoading, text = "Opdaterer...") {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('globalLoader').style.display = isLoading ? 'flex' : 'none';
        }

        function showMessage(msg, isSuccess = false) {
            const el = document.getElementById('statusMessage');
            el.innerText = msg;
            el.className = isSuccess ? 'message-box success-msg' : 'message-box error-msg';
            el.style.display = 'block';
        }

        async function opdaterKode() {
            // Skjul gamle beskeder
            document.getElementById('statusMessage').style.display = 'none';
            
            const nyKode = document.getElementById('nyKode').value.trim();
            const bekraeftKode = document.getElementById('bekraeftKode').value.trim();
            
            // Validering
            if (!nyKode || !bekraeftKode) { 
                showMessage("Udfyld venligst begge felter."); 
                return; 
            }
            if (nyKode.length < 6) { 
                showMessage("Koden skal være mindst 6 tegn."); 
                return; 
            }
            if (nyKode !== bekraeftKode) { 
                showMessage("Adgangskoderne er ikke ens."); 
                return; 
            }

            setLoading(true, "Gemmer ny kode...");

            try {
                // Kalder Supabase for at opdatere brugerens adgangskode
                // Dette virker, fordi brugeren har en midlertidig session fra det link de klikkede på i mailen
                const { error } = await _supabase.auth.updateUser({
                    password: nyKode
                });

                if (error) throw error;

                // Succes!
                showMessage("Din adgangskode er nu opdateret!", true);
                
                // Vent et par sekunder, så de kan læse beskeden, og send dem så til login-siden
                setTimeout(() => {
                    window.location.href = '/login'; // Ret denne URL hvis din loginside hedder noget andet (fx /login.html)
                }, 2500);

            } catch (e) {
                console.error(e);
                showMessage("Fejl: Linket kan være udløbet. Prøv at anmode om et nyt link.");
            } finally {
                setLoading(false);
            }
        }

        // Gør det muligt at trykke "Enter" for at gemme
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') opdaterKode();
        });
    </script>
</body>
</html>
