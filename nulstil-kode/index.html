<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nulstil adgangskode | HoppOn</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="/supabase.js"></script>
    <script src="/components.js" defer></script>

    <style>
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 1rem 2rem 1rem;
        }

        .login-card {
            background: var(--glass-bg, rgba(255,255,255,0.8));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 100%;
            max-width: 420px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
            padding: 3rem 2.5rem;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-card h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            text-align: center;
            color: var(--brand, #1E293B);
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted, #64748B);
            margin-bottom: 2.5rem;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main, #334155);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border, #E2E8F0);
            border-radius: 14px;
            font-size: 1rem;
            background: #F8FAFC;
            color: var(--brand, #1E293B);
            font-weight: 500;
            transition: all 0.2s;
            outline: none;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: var(--accent, #6366F1);
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--brand, #1E293B);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: var(--accent, #6366F1);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }
        
        .btn-submit:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message-box {
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 15px;
            text-align: center;
            display: none;
            padding: 12px;
            border-radius: 12px;
        }

        .error-msg { color: #EF4444; background: #FEF2F2; border: 1px solid #FCA5A5; }
        .success-msg { color: #10B981; background: #ECFDF5; border: 1px solid #6EE7B7; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <hoppon-header></hoppon-header>

    <main>
        <div class="login-card">
            <h1>Ny adgangskode</h1>
            <p class="subtitle">Indtast din nye adgangskode herunder.</p>

            <div class="form-group">
                <label>Ny adgangskode</label>
                <input type="password" id="newPassword" placeholder="Minimum 6 tegn" required>
            </div>

            <div class="form-group">
                <label>Bekræft ny adgangskode</label>
                <input type="password" id="confirmPassword" placeholder="Gentag koden" required>
            </div>

            <div id="updateMessage" class="message-box"></div>

            <button class="btn-submit" id="updateBtn" onclick="updateUserPassword()">Gem ny adgangskode</button>
        </div>
    </main>

    <hoppon-footer></hoppon-footer>

    <script>
        // Tjekker automatisk om linket er gyldigt, når siden loader
        document.addEventListener("DOMContentLoaded", async () => {
            setTimeout(async () => {
                const { data: { session }, error } = await _supabase.auth.getSession();
                
                if (!session) {
                    showMessage("Dette link er enten udløbet eller allerede brugt. Anmod venligst om et nyt link på login-siden.");
                    document.getElementById('updateBtn').disabled = true;
                    document.getElementById('newPassword').disabled = true;
                    document.getElementById('confirmPassword').disabled = true;
                }
            }, 500);
        });

        function showMessage(msg, isSuccess = false) {
            const el = document.getElementById('updateMessage');
            el.innerText = msg;
            el.className = isSuccess ? 'message-box success-msg' : 'message-box error-msg';
            el.style.display = 'block';
        }

        async function updateUserPassword() {
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('updateBtn');

            if (newPass.length < 6) {
                showMessage("Adgangskoden skal være på mindst 6 tegn.");
                return;
            }

            if (newPass !== confirmPass) {
                showMessage("Adgangskoderne er ikke ens.");
                return;
            }

            btn.innerText = "Gemmer...";
            btn.disabled = true;

            try {
                const { error } = await _supabase.auth.updateUser({
                    password: newPass
                });

                if (error) throw error;

                showMessage("Din adgangskode er opdateret! Sender dig til login...", true);
                
                setTimeout(() => {
                    // Ret dette link, hvis din loginside hedder noget andet
                    window.location.href = '/profil'; 
                }, 2000);

            } catch (e) {
                console.error(e);
                showMessage("Der skete en fejl: " + e.message);
                btn.innerText = "Gem ny adgangskode";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
