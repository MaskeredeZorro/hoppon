<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoppOn - Find et lift</title>
    <link rel="icon" href="https://i.imgur.com/4oGYz8n.png" type="image/png">
    <style>
        :root { --slate-900: #0F172A; --indigo-500: #6366F1; --glass-bg: rgba(255, 255, 255, 0.85); --glass-border: rgba(255, 255, 255, 0.6); --shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { height: 100vh; width: 100%; background: radial-gradient(circle at top right, #E0E7FF 0%, #F8FAFC 60%, #FFFFFF 100%); display: flex; align-items: center; justify-content: center; }
        .container { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); padding: 3rem 2rem; border-radius: 32px; box-shadow: var(--shadow); width: 90%; max-width: 480px; display: flex; flex-direction: column; gap: 1.5rem; animation: slideUp 0.8s ease-out; }
        
        h1 { font-size: 1.8rem; font-weight: 800; color: var(--slate-900); text-align: center; margin-bottom: 0.5rem; }
        
        .search-box { display: flex; flex-direction: column; gap: 12px; position: relative; }
        
        /* Den forbindende linje */
        .connector { position: absolute; left: 24px; top: 35px; bottom: 85px; width: 2px; background: #E2E8F0; z-index: 0; }
        
        .input-row { position: relative; z-index: 1; }
        .icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--indigo-500); width: 18px; }
        
        input { width: 100%; padding: 16px 16px 16px 48px; border-radius: 16px; border: 1px solid transparent; background: #fff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); font-size: 1rem; outline: none; }
        input:focus { border-color: var(--indigo-500); }
        
        .btn { background: var(--slate-900); color: white; padding: 18px; border-radius: 16px; text-align: center; text-decoration: none; font-weight: bold; margin-top: 10px; box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.2); transition: 0.2s; display: block; }
        .btn:hover { background: var(--indigo-500); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hvor skal du hen?</h1>
        
        <div class="search-box">
            <div class="connector"></div>
            
            <div class="input-row">
                <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle></svg>
                <input type="text" placeholder="Fra... (f.eks. Aarhus C)">
            </div>
            
            <div class="input-row">
                <svg class="icon" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
                <input type="text" placeholder="Til... (f.eks. København)">
            </div>
            
            <div class="input-row">
                <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                <input type="date">
            </div>
        </div>

        <a href="#" class="btn">Søg efter lift</a>
        <a href="index.html" style="text-align: center; color: #94A3B8; text-decoration: none; font-size: 0.85rem; display:block; margin-top: 10px;">Annuller</a>
    </div>
</body>
</html>
