<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Find et lift | HoppOn Samkørsel</title>
    <meta name="description" content="Rejs billigere, grønnere og sjovere med HoppOn. Find samkørsel i hele Danmark uden skjulte gebyrer. Book dit sæde i dag!">
    <meta name="keywords" content="samkørsel, lift, køre sammen, delebil, billig rejse, danmark, færge">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style.css">
    <script src="/supabase.js"></script>
    <script src="/components.js" defer></script>

    <style>
        /* --- GLOBAL RESET: SIKRER AT INTET SKUBBES UD AF SKÆRMEN --- */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { 
            width: 100%; /* Ændret fra 100vw for at undgå usynlig scrollbar-margin på mobiler */
            max-width: 100%; 
            overflow-x: hidden; /* Forhindrer scroll til siden */
            margin: 0; 
            padding: 0; 
            -webkit-text-size-adjust: 100%; 
        }

        input, select, button {
            -webkit-appearance: none;
            appearance: none;
            font-family: inherit;
        }

        /* DYNAMISK HEADER SØGNING */
        .header-search { 
            position: fixed; 
            top: 12px; 
            left: 50%; 
            transform: translate(-50%, -10px); 
            z-index: 1001; 
            display: flex; 
            gap: 10px; 
            opacity: 0; 
            pointer-events: none; 
            transition: all 0.3s ease; 
            background: white; 
            padding: 8px 12px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .header-search.active { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
        .hs-input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; background: #F1F5F9; outline: none; width: 130px; font-weight: 500;}
        .hs-btn { background: var(--brand); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.85rem;}

        @media (max-width: 900px) { .header-search { display: none !important; } }

        /* SIDESPECIFIKT DESIGN */
        main-content { display: block; padding-top: 75px; flex: 1; }

        .hero { background: linear-gradient(135deg, var(--brand) 0%, #1e293b 100%); padding: 3rem 1rem; text-align: center; color: white; }
        .hero h1 { font-size: 2.5rem; font-weight: 900; margin-bottom: 0.5rem; letter-spacing: -1px; }
        .hero p { color: #cbd5e1; font-size: 1.1rem; margin-bottom: 2rem; }
        
        .search-bar { background: var(--surface); padding: 0.5rem; border-radius: 18px; max-width: 850px; width: 100%; margin: 0 auto; display: flex; gap: 0.5rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); align-items: center; }
        .search-input { flex: 1; min-width: 0; padding: 12px 16px; border: 1px solid transparent; border-radius: 12px; background: #F1F5F9; font-size: 16px; color: var(--brand); font-weight: 500; outline: none; }
        .search-input:focus { border-color: var(--accent); background: white; }
        
        /* Dato felt - lader grå tekst syne frem når tomt */
        .search-input::placeholder { color: #94a3b8; font-weight: 500; }
        #searchDate { max-width: 150px; }
        
        .search-btn { flex-shrink: 0; background: var(--accent); color: white; border: none; padding: 12px 1.8rem; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; }

        /* MOBIL SØGEBAR - 2x2 GRID */
        @media (max-width: 768px) {
            .search-bar { 
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); 
                gap: 12px; 
                padding: 1.2rem; 
                background: rgba(255, 255, 255, 0.15); 
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
            }
            .search-input, .search-btn { 
                width: 100%; 
                min-width: 0; 
                max-width: none !important; 
                height: 50px; 
                margin: 0; 
            }
        }

        .main-container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; display: grid; grid-template-columns: 280px 1fr; gap: 2rem; }
        
        /* FILTRE */
        .filters { background: var(--surface); padding: 1.2rem; border-radius: 20px; border: 1px solid var(--border); position: sticky; top: 90px; height: fit-content; max-height: calc(100vh - 110px); overflow-y: auto; }
        .filters::-webkit-scrollbar { width: 5px; } .filters::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .filter-header { font-size: 1.1rem; font-weight: 800; margin-bottom: 1.2rem; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s ease; width: 100%; }
        .filter-chevron { display: none; font-size: 0.8rem; transition: transform 0.3s ease; }
        .filter-content { display: block; } 

        .filter-group { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .filter-label { font-weight: 700; font-size: 0.8rem; margin-bottom: 0.8rem; display: block; color: var(--text-muted); text-transform: uppercase; }
        
        .price-display { font-weight: 800; color: var(--accent); font-size: 1.1rem; margin-bottom: 0.4rem; display: block; }
        input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; margin-bottom: 10px; }

        .select-input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; margin-bottom: 10px; background: #F1F5F9; outline: none; font-weight: 500;}

        .filter-toggle { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .checkbox-custom { width: 18px; height: 18px; border: 2px solid #cbd5e1; border-radius: 5px; position: relative; flex-shrink: 0; transition: 0.2s;}
        input[type="checkbox"] { display: none; }
        input[type="checkbox"]:checked + .checkbox-custom { background: var(--accent); border-color: var(--accent); }
        input[type="checkbox"]:checked + .checkbox-custom::after { content: "✓"; color: white; position: absolute; left: 2px; top: -1px; font-size: 13px; font-weight: bold; }

        /* KORT-STYLING (TÆT LUKKET FOR AT UNDGÅ OVERFLOW) */
        .ride-list { display: flex; flex-direction: column; gap: 0.8rem; }
        .ride-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 1rem 1.2rem; transition: 0.2s; cursor: pointer; overflow: hidden; max-width: 100%; }
        .ride-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 15px -5px rgba(0,0,0,0.05); }
        
        .card-date { font-size: 0.75rem; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; display: block; }
        
        .timeline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; width: 100%; }
        
        /* City / Time boxes er nu låst, så de korter teksten af med ... hvis for lange */
        .time-box { display: flex; flex-direction: column; flex: 1; min-width: 0; overflow: hidden; }
        .time-box.right { align-items: flex-end; text-align: right; }
        .time { font-size: 1.4rem; font-weight: 900; color: var(--brand); letter-spacing: -0.5px; }
        .city { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; width: 100%; }
        
        .route-path { flex: 0 0 60px; margin: 0 10px; position: relative; display: flex; flex-direction: column; align-items: center; }
        .duration-line { width: 100%; height: 2px; background: #E2E8F0; position: relative; }
        .duration-line::before, .duration-line::after { content: ''; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: white; border: 2px solid #cbd5e1; top: -3px; }
        .duration-line::before { left: -4px; } .duration-line::after { right: -4px; }
        .duration-text { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); background: var(--surface); padding: 0 6px; position: relative; top: -11px; white-space: nowrap; }

        .card-mid { display: flex; justify-content: space-between; align-items: center; padding: 0.7rem 0; border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border); margin-bottom: 0.7rem; width: 100%; min-width: 0; }
        
        .driver { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; overflow: hidden;}
        .avatar { width: 35px; height: 35px; border-radius: 50%; background: #F1F5F9; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; border: 1px solid var(--border); flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .driver-info-box { flex: 1; min-width: 0; overflow: hidden; }
        .driver-name { font-weight: 700; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .car-info { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

        .badge-group { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; flex-shrink: 0; margin-left: 10px; }
        .badge { padding: 2px 8px; border-radius: 20px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-muted);}
        .b-ferry { background: #E0F2FE; color: #0284C7; border-color: #BAE6FD; }
        .b-pink { background: #FCE7F3; color: #BE185D; border-color: #FBCFE8; }
        .b-instant { background: #FEF3C7; color: #B45309; border-color: #FDE68A; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 1.5rem; font-weight: 900; color: var(--brand); letter-spacing: -0.5px; }
        .seats-left { font-weight: 700; color: var(--success); font-size: 0.8rem; }

        /* LOADERS */
        #globalLoader { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.9); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* MOBILVISNING (MAX 950px) */
        @media (max-width: 950px) { 
            .main-container { grid-template-columns: 1fr; } 
            
            .filters { position: relative; top: 0; max-height: none; margin-bottom: 1rem; padding: 1rem 1.2rem; } 
            
            .filter-header { cursor: pointer; margin-bottom: 0; padding-bottom: 0; }
            .filter-header.open { margin-bottom: 1.2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
            .filter-chevron { display: inline-block; margin-left: 8px;}
            .filter-chevron.open { transform: rotate(180deg); }
            
            .filter-content { display: none; }
            .filter-content.open { display: block; animation: fadeIn 0.3s ease; }
            @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        }

        /* SMÅ MOBILER (MAX 480px) */
        @media (max-width: 480px) {
            .time { font-size: 1.25rem; } 
            
            /* Sørger for at indholdet brydes korrekt på meget smalle skærme */
            .card-mid { flex-direction: column; align-items: flex-start; gap: 10px; }
            .badge-group { justify-content: flex-start; margin-left: 0; }
            .driver { width: 100%; }
            
            .card-footer { flex-direction: column; align-items: flex-start; gap: 4px; }
            .price { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div id="globalLoader"><div class="spinner"></div></div>

    <hoppon-header></hoppon-header>
    
    <div class="header-search" id="headerSearch">
        <input type="text" class="hs-input" id="hsFrom" placeholder="Hvorfra?" oninput="syncInputs('hsFrom', 'searchFrom'); filterRides();">
        <input type="text" class="hs-input" id="hsTo" placeholder="Hvorhen?" oninput="syncInputs('hsTo', 'searchTo'); filterRides();">
        <button class="hs-btn" onclick="window.scrollTo({top: 300, behavior: 'smooth'})">⚙️ Filtre</button>
    </div>

    <main-content>
        <section class="hero" id="heroSection">
            <h1>Find dit næste lift</h1>
            <p>Samkørsel i hele Danmark. 0 kr i gebyr.</p>
            <div class="search-bar">
                <input type="text" class="search-input" id="searchFrom" placeholder="Fra (f.eks. Aarhus)" oninput="syncInputs('searchFrom', 'hsFrom'); filterRides();">
                <input type="text" class="search-input" id="searchTo" placeholder="Til (f.eks. København)" oninput="syncInputs('searchTo', 'hsTo'); filterRides();">
                
                <input type="text" class="search-input" id="searchDate" 
                       onfocus="(this.type='date')" 
                       onblur="if(!this.value) this.type='text'" 
                       onchange="filterRides()">
                       
                <button class="search-btn" onclick="filterRides()">Søg</button>
            </div>
        </section>

        <div class="main-container">
            <aside class="filters">
                <div class="filter-header" id="mobileFilterHeader" onclick="toggleMobileFilters()">
                    <span>Filtre</span> 
                    <div style="display:flex; align-items:center;">
                        <button style="background:none; border:none; color:var(--accent); font-weight:700; font-size:0.85rem; cursor:pointer; padding:0; white-space:nowrap;" onclick="resetFilters(event)">Nulstil alt</button>
                        <span class="filter-chevron" id="filterChevron">▼</span>
                    </div>
                </div>
                
                <div class="filter-content" id="filterContent">
                    <div class="filter-group" style="padding-top: 0.5rem;">
                        <span class="filter-label">Maks pris pr. plads</span>
                        <span class="price-display" id="priceOutput">500 kr</span>
                        <input type="range" id="filterPrice" min="20" max="500" value="500" step="10" oninput="updatePriceLabel(); filterRides()">
                    </div>

                    <div class="filter-group">
                        <span class="filter-label">Detaljer</span>
                        <select id="f-seats" class="select-input" onchange="filterRides()">
                            <option value="1">Søger mindst 1 plads</option>
                            <option value="2">Søger mindst 2 pladser</option>
                            <option value="3">Søger 3+ pladser</option>
                        </select>
                        
                        <select id="f-luggage" class="select-input" onchange="filterRides()">
                            <option value="">Al Bagage (Ligegyldigt)</option>
                            <option value="Lille">Mindst Lille (Taske)</option>
                            <option value="Mellem">Mindst Mellem (Kuffert)</option>
                            <option value="Stor">Stor (Kuffert + ekstra)</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <span class="filter-label">Køre-muligheder</span>
                        <label class="filter-toggle"><span>⚡ Lynbooking (Auto)</span><input type="checkbox" id="f-instant" onchange="filterRides()"><div class="checkbox-custom"></div></label>
                        <label class="filter-toggle"><span>🛋️ Komfort (Max 2 bagved)</span><input type="checkbox" id="f-comfort" onchange="filterRides()"><div class="checkbox-custom"></div></label>
                        <label class="filter-toggle"><span>⛴️ Via Færge</span><input type="checkbox" id="f-ferry" onchange="filterRides()"><div class="checkbox-custom"></div></label>
                        <label class="filter-toggle"><span>🛣️ Flex (Op til 5 min omvej)</span><input type="checkbox" id="f-flex" onchange="filterRides()"><div class="checkbox-custom"></div></label>
                        <label class="filter-toggle" style="color: var(--pink); display: none;" id="filterLadiesOnlyRow"><span>🌸 Ladies Only</span><input type="checkbox" id="f-ladies" onchange="filterRides()"><div class="checkbox-custom" style="border-color: #fbcfe8;"></div></label>
                    </div>

                    <div class="filter-group" style="border:none; padding:0; margin:0;">
                        <span class="filter-label">Tilladt i bilen</span>
                        <label class="filter-toggle"><span>🐾 Kæledyr tilladt</span><input type="checkbox" id="f-pets" onchange="filterRides()"><div class="checkbox-custom"></div></label>
                        <label class="filter-toggle"><span>🚬 Rygning tilladt</span><input type="checkbox" id="f-smoking" onchange="filterRides()"><div class="checkbox-custom"></div></label>
                        <label class="filter-toggle"><span>👶 Børn i bilen</span><input type="checkbox" id="f-kids" onchange="filterRides()"><div class="checkbox-custom"></div></label>
                        <label class="filter-toggle"><span>🎵 Musik tilladt</span><input type="checkbox" id="f-music" onchange="filterRides()"><div class="checkbox-custom"></div></label>
                    </div>
                </div>
            </aside>

            <main>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                    <span style="font-weight: 700; color: var(--brand); font-size: 1.1rem;" id="resultsCount">Søger efter ture...</span>
                    <select style="width:auto; padding:8px 12px; border:1px solid var(--border); border-radius:10px; font-weight:500; outline:none;" id="sortSelect" onchange="filterRides()">
                        <option value="time">Tidligste afgang</option>
                        <option value="price">Laveste pris</option>
                    </select>
                </div>
                
                <div id="loader" style="text-align:center; padding: 3rem; font-weight:bold; color:var(--accent);">Henter de bedste lift... 🚗💨</div>
                <div class="ride-list" id="rideListContainer" style="display: none;"></div>
                
                <div id="emptyState" style="display:none; text-align:center; padding: 4rem; background:var(--surface); border-radius:20px; border:1px dashed #cbd5e1;">
                    <h3 style="color:var(--brand); margin-bottom:5px;">Ingen ture fundet 🏜️</h3>
                    <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:15px;">Prøv at ændre dine filtre for at se flere resultater.</p>
                    <button class="btn-primary" onclick="resetFilters()">Ryd alle filtre</button>
                </div>
            </main>
        </div>
    </main-content>

    <hoppon-footer></hoppon-footer>

    <script>
        let allRides = [];
        let isUserLoggedIn = false;

        function toggleMobileFilters() {
            if (window.innerWidth <= 950) {
                document.getElementById('filterContent').classList.toggle('open');
                document.getElementById('filterChevron').classList.toggle('open');
                document.getElementById('mobileFilterHeader').classList.toggle('open');
            }
        }

        window.addEventListener('scroll', () => {
            const hero = document.getElementById('heroSection');
            const headerSearch = document.getElementById('headerSearch');
            if (window.scrollY > hero.offsetHeight - 50) {
                headerSearch.classList.add('active');
            } else {
                headerSearch.classList.remove('active');
            }
        });

        function syncInputs(sourceId, targetId) {
            document.getElementById(targetId).value = document.getElementById(sourceId).value;
        }

        window.onload = async () => {
            // Sæt Dags Dato ind i placeholder feltet, så det ser pænt ud
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            document.getElementById('searchDate').placeholder = `${dd}/${mm}/${yyyy}`;

            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                isUserLoggedIn = true;
                const { data: profile } = await _supabase.from('profiles').select('*').eq('id', session.user.id).single();
                if (profile?.gender === 'Kvinde') document.getElementById('filterLadiesOnlyRow').style.display = 'flex';
                
                const loginBtn = document.querySelector('.nav-btn-login');
                if(loginBtn) {
                    loginBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> Log ud`;
                    loginBtn.onclick = async (e) => { e.preventDefault(); await _supabase.auth.signOut(); location.reload(); };
                }
            }

            const urlParams = new URLSearchParams(window.location.search);
            const fraParam = urlParams.get('fra');
            const tilParam = urlParams.get('til');

            if (fraParam) {
                document.getElementById('searchFrom').value = fraParam;
                document.getElementById('hsFrom').value = fraParam;
            }
            if (tilParam) {
                document.getElementById('searchTo').value = tilParam;
                document.getElementById('hsTo').value = tilParam;
            }

            await fetchRides();
            document.getElementById('globalLoader').style.display = 'none';
        };

        async function fetchRides() {
            const nowISO = new Date().toISOString(); 
            const { data, error } = await _supabase.from('rides')
                .select('*, driver:profiles!driver_id(full_name, avatar_url)')
                .eq('status', 'active')
                .gte('departure_time', nowISO)
                .order('departure_time', { ascending: true });

            if (!error) {
                allRides = data || [];
                renderRides(allRides);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('rideListContainer').style.display = 'flex';
                filterRides(); 
            }
        }

        function filterRides() {
            const from = document.getElementById('searchFrom').value.toLowerCase();
            const to = document.getElementById('searchTo').value.toLowerCase();
            
            // Dato felt logik: Hvis den er type='text', har brugeren IKKE valgt dato
            const dateInput = document.getElementById('searchDate');
            let qDate = "";
            if(dateInput.type === 'date') { qDate = dateInput.value; }

            const maxP = parseInt(document.getElementById('filterPrice').value);
            const reqSeats = parseInt(document.getElementById('f-seats').value);
            const reqLuggage = document.getElementById('f-luggage').value;

            const filtered = allRides.filter(r => {
                const rawOrigin = r.origin_city;
                const rawDest = r.destination_city;
                
                if (from && !rawOrigin.toLowerCase().includes(from)) return false;
                if (to && !rawDest.toLowerCase().includes(to)) return false;
                if (qDate && new Date(r.departure_time).toISOString().split('T')[0] !== qDate) return false;
                
                if (r.price_dkk > maxP) return false;
                if (r.seats_available < reqSeats) return false;
                
                if (reqLuggage) {
                    if (reqLuggage === 'Stor' && r.luggage_size !== 'Stor') return false;
                    if (reqLuggage === 'Mellem' && r.luggage_size === 'Lille') return false;
                }

                if (document.getElementById('f-ferry').checked && !r.is_ferry) return false;
                if (document.getElementById('f-instant').checked && !r.instant_booking) return false;
                if (document.getElementById('f-comfort').checked && !r.comfort_guarantee) return false;
                if (document.getElementById('f-flex').checked && !r.detour_flex) return false;
                if (document.getElementById('f-ladies').checked && !r.ladies_only) return false;
                if (document.getElementById('f-pets').checked && !r.pets) return false;
                if (document.getElementById('f-smoking').checked && !r.smoking) return false;
                if (document.getElementById('f-kids').checked && !r.kids) return false;
                if (document.getElementById('f-music').checked && !r.music) return false;
                
                return true;
            });

            const sortBy = document.getElementById('sortSelect').value;
            if (sortBy === 'price') filtered.sort((a, b) => a.price_dkk - b.price_dkk);
            else filtered.sort((a, b) => new Date(a.departure_time) - new Date(b.departure_time));

            renderRides(filtered);
        }

        function renderRides(rides) {
            const container = document.getElementById('rideListContainer');
            const empty = document.getElementById('emptyState');
            container.innerHTML = '';
            document.getElementById('resultsCount').innerText = `${rides.length} tur(e)`;

            if (rides.length === 0) { empty.style.display = 'block'; return; }
            empty.style.display = 'none';

            rides.forEach(ride => {
                const depDate = new Date(ride.departure_time);
                const arrDate = ride.arrival_time ? new Date(ride.arrival_time) : null;
                let hrs = 0, mins = 0, arrTimeStr = "--:--";
                if(arrDate) {
                    const diff = Math.abs(arrDate - depDate);
                    hrs = Math.floor(diff / 3600000);
                    mins = Math.floor((diff / 60000) % 60);
                    arrTimeStr = arrDate.toLocaleTimeString('da-DK', {hour:'2-digit', minute:'2-digit'});
                }

                const displayOrigin = ride.origin_city;
                const displayDest = ride.destination_city;

                let car = { display_name: 'Bil' };
                try { car = typeof ride.car_model === 'string' ? JSON.parse(ride.car_model) : ride.car_model; } catch(e) {}

                let bHTML = '';
                if (ride.is_ferry) bHTML += `<span class="badge b-ferry">⛴️ Færge</span>`;
                if (ride.instant_booking) bHTML += `<span class="badge b-instant">⚡ Lyn</span>`;
                if (ride.comfort_guarantee) bHTML += `<span class="badge">🛋️ Komfort</span>`;
                if (ride.detour_flex) bHTML += `<span class="badge">🛣️ Flex</span>`;
                if (ride.pref_pets) bHTML += `<span class="badge">🐾 Dyr</span>`;
                if (ride.pref_kids) bHTML += `<span class="badge">👶 Børn</span>`;
                if (ride.pref_music) bHTML += `<span class="badge">🎵 Musik</span>`;
                if (ride.pref_smoking) bHTML += `<span class="badge">🚬 Rygning</span>`;
                if (ride.ladies_only) bHTML += `<span class="badge b-pink">🌸 Ladies</span>`;

                const card = document.createElement('div');
                card.className = 'ride-card';
                
                card.onclick = () => {
                    if (!isUserLoggedIn) {
                        alert("Log ind for at booke turen! 🚀");
                        window.location.href = '/login';
                    } else {
                        const urlId = ride.ride_number || ride.id;
                        window.location.href = '/lift/' + urlId;
                    }
                };

                // Opdateret HTML til at håndtere overflow
                card.innerHTML = `
                    <span class="card-date">${depDate.toLocaleDateString('da-DK', {weekday:'short', day:'numeric', month:'short'})}</span>
                    <div class="timeline">
                        <div class="time-box">
                            <span class="time">${depDate.toLocaleTimeString('da-DK', {hour:'2-digit', minute:'2-digit'})}</span>
                            <span class="city" title="${displayOrigin}">${displayOrigin}</span>
                        </div>
                        <div class="route-path">
                            <div class="duration-text">${hrs}t ${mins}m</div>
                            <div class="duration-line"></div>
                        </div>
                        <div class="time-box right">
                            <span class="time">${arrTimeStr}</span>
                            <span class="city" title="${displayDest}">${displayDest}</span>
                        </div>
                    </div>
                    <div class="card-mid">
                        <div class="driver">
                            <div class="avatar">${ride.driver?.avatar_url ? `<img src="${ride.driver.avatar_url}">` : ride.driver?.full_name[0] || '👤'}</div>
                            <div class="driver-info-box">
                                <span class="driver-name">${ride.driver?.full_name || 'Chauffør'}</span>
                                <span class="car-info">🚗 ${car?.display_name || 'Bil'} ${car?.plate ? `• ${car.plate}` : ''}</span>
                            </div>
                        </div>
                        <div class="badge-group">${bHTML}</div>
                    </div>
                    <div class="card-footer">
                        <div class="price">${ride.price_dkk}<span> kr</span></div>
                        <div class="seats-left">✔️ ${ride.seats_available} pladser</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updatePriceLabel() { document.getElementById('priceOutput').innerText = document.getElementById('filterPrice').value + " kr"; }
        
        function resetFilters(event) {
            if (event) event.stopPropagation(); 
            document.getElementById('searchFrom').value = ''; 
            document.getElementById('hsFrom').value = '';
            document.getElementById('searchTo').value = ''; 
            document.getElementById('hsTo').value = '';
            
            const dateInput = document.getElementById('searchDate');
            dateInput.value = '';
            dateInput.type = 'text'; // Gør det tilbage til tekst så placeholderen vises igen

            document.getElementById('filterPrice').value = 500;
            document.getElementById('f-seats').value = "1";
            document.getElementById('f-luggage').value = "";
            document.querySelectorAll('input[type=checkbox]').forEach(c => c.checked = false);
            updatePriceLabel(); 
            filterRides();
        }
    </script>
</body>
</html>
