<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Profil | HoppOn</title>
    <link rel="icon" href="https://i.imgur.com/4oGYz8n.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="/style.css">
    <script src="/supabase.js"></script>
    <script src="/components.js" defer></script>

    <style>
        main { padding-top: 100px; padding-bottom: 5rem; background: #F8FAFC; min-height: 100vh; }
        .dashboard-container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: grid; grid-template-columns: 320px 1fr; gap: 2rem; }

        /* SIDEBAR */
        .sidebar { background: white; border-radius: 24px; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: 1px solid var(--border); height: fit-content; }
        .profile-header { text-align: center; margin-bottom: 2rem; }
        .avatar-container { position: relative; width: 110px; height: 110px; margin: 0 auto 1rem auto; cursor: pointer; }
        .avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; background: #E2E8F0; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .avatar-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; color: white; font-size: 1.5rem; }
        .avatar-container:hover .avatar-overlay { opacity: 1; }
        .avatar-loading { position: absolute; inset: 0; background: rgba(255,255,255,0.8); border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 10; }
        .spinner { width: 30px; height: 30px; border: 3px solid #E2E8F0; border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        .profile-name { font-size: 1.5rem; font-weight: 800; color: var(--brand); margin-bottom: 0.2rem; }
        .profile-phone { color: var(--text-muted); font-size: 0.95rem; font-weight: 500; }
        .badge-verified { display: inline-flex; align-items: center; gap: 5px; background: #DCFCE7; color: #166534; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; margin-top: 10px; }
        .sidebar-section { border-top: 1px solid #F1F5F9; padding-top: 1.5rem; margin-top: 1.5rem; }
        .sidebar-section h4 { font-size: 0.9rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 1rem; }
        .balance-box { background: var(--brand); color: white; padding: 1.5rem; border-radius: 16px; text-align: center; }
        .balance-amount { font-size: 2rem; font-weight: 900; margin: 5px 0; }
        .pending-amount { font-size: 0.85rem; color: #94A3B8; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 500; color: var(--brand); }
        .stat-value { font-weight: 800; color: var(--accent); }

        /* TABS (Hoved) */
        .tabs { display: flex; gap: 0.5rem; background: white; padding: 0.5rem; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid var(--border); overflow-x: auto;}
        .tab-btn { flex: 1; padding: 12px 15px; border: none; background: transparent; font-weight: 700; font-size: 0.95rem; color: var(--text-muted); cursor: pointer; border-radius: 12px; transition: 0.2s; white-space: nowrap;}
        .tab-btn.active { background: var(--brand); color: white; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; margin-top: 1.5rem;}
        .tab-content.active { display: block; }

        /* SUB-TABS (Ture: Jeg kører / Jeg rejser) */
        .sub-tabs { display: flex; background: #F1F5F9; border-radius: 25px; padding: 4px; margin-bottom: 1.5rem; }
        .sub-tab-btn { flex: 1; text-align: center; padding: 10px; border-radius: 25px; font-weight: 700; font-size: 0.95rem; cursor: pointer; color: #64748B; transition: 0.2s; border: none; background: transparent; }
        .sub-tab-btn.active { background: var(--primary); color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .sub-tab-content { display: none; }
        .sub-tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        /* CARDS & FORMS */
        .card { background: white; border-radius: 24px; padding: 2.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .card h2 { font-size: 1.8rem; font-weight: 900; color: var(--brand); margin-bottom: 0.5rem; letter-spacing: -0.5px; }
        .form-group { margin-bottom: 1.5rem; position: relative; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        label { display: block; font-weight: 700; color: var(--brand); margin-bottom: 0.5rem; font-size: 0.95rem; }
        input, select, textarea { width: 100%; padding: 14px 16px; border: 1px solid #E2E8F0; border-radius: 12px; background: #F8FAFC; font-size: 1rem; font-family: inherit; font-weight: 500; outline: none; transition: 0.2s; box-sizing: border-box;}
        input:focus, select:focus, textarea:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        input[readonly] { background: #E2E8F0; color: #64748B; cursor: not-allowed; }
        .helper-text { font-size: 0.85rem; color: #64748B; margin-top: 5px; }
        .btn-submit { background: var(--accent); color: white; width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(99,102,241,0.2); }
        
        /* RIDE CARDS (Oversat fra Flutter) */
        .ride-card { background: white; border: 1px solid var(--border); border-radius: 16px; margin-bottom: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.02); overflow: hidden; }
        .ride-header { padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .ride-header:hover { background: #F8FAFC; }
        .route-title { font-weight: 800; color: var(--brand); font-size: 1.2rem; margin-bottom: 5px; }
        .ride-meta { color: var(--text-muted); font-size: 0.95rem; font-weight: 500; }
        .ride-price { font-size: 1.3rem; font-weight: 900; color: var(--brand); }
        
        /* TIMELINE */
        .ride-details { display: none; border-top: 1px solid #F1F5F9; padding: 1.5rem; }
        .timeline { margin-bottom: 1.5rem; }
        .timeline-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .time-col { width: 50px; font-weight: 700; color: var(--text-muted); font-size: 0.9rem; }
        .node-col { display: flex; flex-direction: column; align-items: center; }
        .node { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent); background: white; }
        .node.filled { background: var(--accent); }
        .line { width: 2px; flex: 1; background: #E2E8F0; margin: 4px 0; min-height: 20px;}
        .city-col { font-weight: 600; color: var(--brand); flex: 1; padding-bottom: 10px; }
        
        /* PASSENGERS */
        .passenger-list { margin-top: 1.5rem; }
        .passenger-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #F1F5F9; }
        .passenger-info { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--brand); }
        .passenger-actions { display: flex; gap: 10px; }
        .btn-icon { background: #F1F5F9; border: none; width: 35px; height: 35px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .btn-icon.green { color: #166534; background: #DCFCE7; }
        .btn-icon.red { color: #991B1B; background: #FEE2E2; }
        .btn-icon.blue { color: #1E40AF; background: #DBEAFE; }

        /* RIDE BUTTONS */
        .action-bar { display: flex; gap: 10px; margin-top: 1.5rem; }
        .btn-outline { flex: 1; border: 1px solid var(--border); background: white; padding: 12px; border-radius: 12px; font-weight: 700; color: var(--brand); cursor: pointer; transition: 0.2s;}
        .btn-outline:hover { background: #F8FAFC; }
        .btn-action-main { flex: 1; background: #22C55E; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .btn-action-main:disabled { background: #E2E8F0; color: #94A3B8; cursor: not-allowed; }
        .btn-danger { color: #EF4444; border-color: #FECACA; background: #FEF2F2; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-box { background: white; padding: 2rem; border-radius: 24px; width: 90%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); text-align: center; }
        .modal-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 0.5rem; }
        .modal-text { color: var(--text-muted); margin-bottom: 2rem; line-height: 1.5; }
        .modal-actions { display: flex; gap: 1rem; }
        
        .suggestions-box { display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 100; max-height: 200px; overflow-y: auto; margin-top: 5px;}
        .suggestion-item { padding: 12px 16px; cursor: pointer; font-size: 0.95rem; border-bottom: 1px solid #F1F5F9; color: var(--brand); display: flex; align-items: center; gap: 10px;}
        .suggestion-item:hover { background: #F8FAFC; color: var(--accent); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @media (max-width: 900px) { .dashboard-container { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr; gap: 0; } .card { padding: 1.5rem; } }
    </style>
</head>
<body>

    <hoppon-header></hoppon-header>

    <main>
        <div class="dashboard-container">
            <aside class="sidebar">
                <div class="profile-header">
                    <div class="avatar-container" onclick="document.getElementById('avatarUpload').click()">
                        <img src="" alt="Profilbillede" class="avatar" id="ui-avatar" style="display: none;">
                        <div class="avatar" id="ui-avatar-placeholder" style="display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: #94A3B8;">👤</div>
                        <div class="avatar-overlay">📷</div>
                        <div class="avatar-loading" id="avatar-loading"><div class="spinner"></div></div>
                    </div>
                    <input type="file" id="avatarUpload" accept="image/*" style="display: none;" onchange="uploadAvatar(event)">
                    <div class="profile-name" id="ui-name">Henter...</div>
                    <div class="profile-phone" id="ui-phone">--</div>
                    <div id="ui-badges"></div>
                </div>
                <div class="balance-box">
                    <p>Tilgængelig saldo</p>
                    <div class="balance-amount"><span id="ui-balance">0.00</span> kr.</div>
                    <div class="pending-amount">Afventer udbetaling: <span id="ui-pending">0.00</span> kr.</div>
                </div>
                <div class="sidebar-section">
                    <h4>Kørsel & Statistik</h4>
                    <div class="stat-row"><span>Kørte ture</span><span class="stat-value" id="ui-rides">0</span></div>
                    <div class="stat-row"><span>CO2 Sparet</span><span class="stat-value"><span id="ui-co2">0</span> kg</span></div>
                </div>
            </aside>

            <div class="content-area">
                
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchMainTab('tab-ture', this)">Dine Ture</button>
                    <button class="tab-btn" onclick="switchMainTab('tab-profil', this)">Indstillinger</button>
                    <button class="tab-btn" onclick="switchMainTab('tab-skat', this)">Udbetaling & Skat</button>
                </div>

                <div id="tab-ture" class="tab-content active">
                    <div class="card" style="padding: 1.5rem;">
                        <div class="sub-tabs">
                            <button class="sub-tab-btn active" onclick="switchSubTab('sub-driver', this)">🚗 Jeg kører</button>
                            <button class="sub-tab-btn" onclick="switchSubTab('sub-passenger', this)">🎒 Jeg rejser</button>
                        </div>

                        <div id="sub-driver" class="sub-tab-content active">
                            <div id="driver-rides-list">
                                <div style="text-align: center; padding: 2rem; color: var(--text-muted);">Henter ture...</div>
                            </div>
                        </div>

                        <div id="sub-passenger" class="sub-tab-content">
                            <div id="passenger-rides-list">
                                <div style="text-align: center; padding: 2rem; color: var(--text-muted);">Henter rejser...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="tab-profil" class="tab-content">
                    <div class="card">
                        <h2>Personlige oplysninger</h2>
                        <form id="profileForm" onsubmit="updateProfileInfo(event)">
                            <div class="form-group"><label>Fulde navn</label><input type="text" id="prof-fullname" required></div>
                            <div class="form-row">
                                <div class="form-group"><label>Telefonnummer</label><input type="tel" id="prof-phone" required></div>
                                <div class="form-group"><label>Køn</label><select id="prof-gender"><option value="Mand">Mand</option><option value="Kvinde">Kvinde</option><option value="Andet">Andet</option></select></div>
                            </div>
                            <div class="form-group"><label>Kort Bio</label><textarea id="prof-bio" rows="3"></textarea></div>
                            <div id="profileMessage" style="text-align: center; display: none;"></div>
                            <button type="submit" class="btn-submit" id="prof-submitBtn">Gem ændringer</button>
                        </form>
                        <div style="margin-top: 3rem; text-align: center; border-top: 1px solid #F1F5F9; padding-top: 2rem;">
                            <a href="/gdpr" style="color: #EF4444; font-weight: 700; text-decoration: none;">Slet min konto</a>
                        </div>
                    </div>
                </div>

                <div id="tab-skat" class="tab-content">
                    <div class="card">
                        <h2>Skatteoplysninger (DAC7)</h2>
                        <form id="taxForm" onsubmit="submitTaxInfo(event)">
                            <div class="form-row">
                                <div class="form-group"><label>Fornavn</label><input type="text" id="fName" required></div>
                                <div class="form-group"><label>Efternavn</label><input type="text" id="lName" required></div>
                            </div>
                            <div class="form-row">
                                <div class="form-group"><label>Fødselsdato</label><input type="date" id="dob" required></div>
                                <div class="form-group"><label>Land</label><select id="country"><option value="Danmark">Danmark</option></select></div>
                            </div>
                            <div class="form-group">
                                <label>Hjemstedsadresse</label>
                                <input type="text" id="address" required oninput="searchAddress(this.value)" autocomplete="off">
                                <div id="address-suggestions" class="suggestions-box"></div>
                            </div>
                            <div class="form-group"><label>Etage, dør (valgfri)</label><input type="text" id="floorDoor"></div>
                            <hr style="margin: 2rem 0;">
                            <div class="form-group">
                                <label>CPR-nummer</label>
                                <input type="text" id="cpr" required maxlength="10" placeholder="DDMMÅÅXXXX">
                            </div>
                            <div class="form-group">
                                <label>Bank IBAN-nummer</label>
                                <input type="text" id="iban" required placeholder="DK00..." style="text-transform: uppercase;">
                            </div>
                            <div id="formMessage" style="text-align: center; display: none;"></div>
                            <button type="submit" class="btn-submit" id="submitBtn">Gem & Krypter Oplysninger</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h2 class="modal-title" id="modalTitle">Titel</h2>
            <p class="modal-text" id="modalText">Tekst</p>
            <div class="modal-actions">
                <button class="btn-outline" style="flex:1" onclick="closeModal()">Fortryd</button>
                <button class="btn-submit" style="flex:1; background: #EF4444;" id="modalConfirmBtn">Bekræft</button>
            </div>
        </div>
    </div>

    <script>
        const MAPBOX_TOKEN = "pk.eyJ1IjoiaG9wcG9uIiwiYSI6ImNtbGwyMGtqeDAzMGYzZXNjb2oxYnl1b3kifQ.6iIPHY6DO6uD7hp-yW_IlA";
        let currentUser = null;
        let isCprLocked = false;
        let activeDriverRides = [];

        // INIT
        window.onload = async () => {
            if (typeof _supabase === 'undefined') return;
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) { window.location.href = '/login'; return; }
            currentUser = session.user;
            
            await loadProfileData();
            await loadTaxData();
            await fetchDriverRides();
            await fetchPassengerRides();
        };

        // UI TABS
        function switchMainTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }
        function switchSubTab(tabId, btn) {
            document.querySelectorAll('.sub-tab-content').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.sub-tab-btn').forEach(e => e.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }
        function toggleExpand(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        // FORMATTERING
        function formatDateTime(isoString) {
            const d = new Date(isoString);
            return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')} • ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        }
        function formatTimeOnly(isoString) {
            if(!isoString) return "--:--";
            const d = new Date(isoString);
            return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        }

        // ==========================================
        // 1. CHAUFFØR LOGIK (Jeg Kører)
        // ==========================================
        async function fetchDriverRides() {
            try {
                // Hent rides + relaterede bookings + passager profiler
                const { data: rides, error } = await _supabase
                    .from('rides')
                    .select('*, bookings(id, passenger_id, status, seats_booked, profiles(full_name, avatar_url))')
                    .eq('driver_id', currentUser.id)
                    .order('departure_time', { ascending: true });
                
                if(error) throw error;

                const now = new Date();
                activeDriverRides = rides.filter(r => {
                    const dep = new Date(r.departure_time);
                    const isCompleted = r.status === 'completed';
                    // Vis hvis ikke completed OG ikke over 24 timer gammel
                    return !isCompleted && now < new Date(dep.getTime() + (24 * 60 * 60 * 1000));
                });

                renderDriverRides();
            } catch (err) {
                document.getElementById('driver-rides-list').innerHTML = `<p style="color:red;text-align:center;">Fejl: ${err.message}</p>`;
            }
        }

        function renderDriverRides() {
            const container = document.getElementById('driver-rides-list');
            if (activeDriverRides.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:3rem 1rem; background:#F8FAFC; border-radius:16px; border:2px dashed #E2E8F0;">
                        <span style="font-size:3rem;">🚗</span>
                        <h3 style="color:var(--brand); margin-top:1rem;">Du har ingen kommende ture</h3>
                        <p style="color:var(--text-muted);"><a href="/opret-tur" style="color:var(--accent); font-weight:bold;">Udbyd en tur her</a></p>
                    </div>`;
                return;
            }

            let html = '';
            activeDriverRides.forEach(ride => {
                const dep = new Date(ride.departure_time);
                const isPassed = new Date() > new Date(ride.arrival_time);
                const waypoints = ride.waypoints || [];
                const bookings = ride.bookings || [];
                const activeBookings = bookings.filter(b => b.status === 'approved' || b.status === 'pending');
                
                // Kapacitet
                const totalCap = ride.seats_available || 3;
                
                // Passager Liste HTML
                let passengersHTML = '';
                let seatsFilled = 0;
                
                activeBookings.forEach(b => {
                    const name = b.profiles ? b.profiles.full_name : 'Ukendt';
                    const seats = b.seats_booked || 1;
                    seatsFilled += seats;
                    
                    let actionsHTML = '';
                    if (b.status === 'pending') {
                        actionsHTML = `
                            <button class="btn-icon green" onclick="updateBooking('${b.id}', 'approved', '${name}')" title="Godkend">✓</button>
                            <button class="btn-icon red" onclick="updateBooking('${b.id}', 'rejected', '${name}')" title="Afvis">✕</button>
                        `;
                    } else {
                        actionsHTML = `<button class="btn-icon red" onclick="driverCancelPassenger('${b.id}', '${name}')" title="Fjern">✕</button>`;
                    }

                    passengersHTML += `
                        <div class="passenger-item">
                            <div class="passenger-info">👤 ${name} ${seats > 1 ? `(${seats} sæder)` : ''}</div>
                            <div class="passenger-actions">
                                <a href="/chat?id=${b.passenger_id}" class="btn-icon blue" title="Chat">💬</a>
                                ${actionsHTML}
                            </div>
                        </div>`;
                });

                // Ledige sæder
                for(let i=seatsFilled; i<totalCap; i++) {
                    passengersHTML += `<div class="passenger-item"><div class="passenger-info" style="color:#94A3B8;">🪑 Ledigt sæde</div></div>`;
                }

                html += `
                <div class="ride-card">
                    <div class="ride-header" onclick="toggleExpand('details-${ride.id}')">
                        <div>
                            <div class="route-title">${ride.origin_city} ➝ ${ride.destination_city}</div>
                            <div class="ride-meta">${formatDateTime(ride.departure_time)}</div>
                        </div>
                        <div class="ride-price">${ride.price_dkk} kr.</div>
                    </div>
                    <div class="ride-details" id="details-${ride.id}">
                        
                        <div class="timeline">
                            <h4 style="margin:0 0 10px 0;">Ruteplan</h4>
                            <div class="timeline-row">
                                <div class="time-col">${formatTimeOnly(ride.departure_time)}</div>
                                <div class="node-col"><div class="node filled"></div><div class="line"></div></div>
                                <div class="city-col">${ride.origin_city}</div>
                            </div>
                            ${waypoints.map(wp => `
                                <div class="timeline-row">
                                    <div class="time-col">${wp.departure_time || '--:--'}</div>
                                    <div class="node-col"><div class="node"></div><div class="line"></div></div>
                                    <div class="city-col">${wp.city}</div>
                                </div>

        }

        // ==========================================
        // 2. PASSAGER LOGIK (Jeg Rejser)
        // ==========================================
        async function fetchPassengerRides() {
            try {
                // Hent bookings hvor jeg er passager
                const { data: bookings, error } = await _supabase
                    .from('bookings')
                    .select('id, ride_id, status, seats_booked, rides(*, profiles(full_name, avatar_url))')
                    .eq('passenger_id', currentUser.id)
                    .order('created_at', { ascending: false });
                
                if(error) throw error;

                const now = new Date();
                const activeTrips = bookings.filter(b => {
                    const ride = b.rides;
                    if(!ride) return false;
                    const dep = new Date(ride.departure_time);
                    const isCancelled = b.status === 'rejected' || b.status.includes('cancel');
                    const isCompleted = ride.status === 'completed';
                    const isOld = now > new Date(dep.getTime() + (24 * 60 * 60 * 1000));
                    return !isCancelled && !isCompleted && !isOld;
                });

                const container = document.getElementById('passenger-rides-list');
                if (activeTrips.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:3rem 1rem; background:#F8FAFC; border-radius:16px; border:2px dashed #E2E8F0;"><span style="font-size:3rem;">🎒</span><h3 style="color:var(--brand); margin-top:1rem;">Ingen kommende rejser</h3></div>`;
                    return;
                }

                let html = '';
                activeTrips.forEach(b => {
                    const ride = b.rides;
                    const driver = ride.profiles;
                    
                    // Status styling
                    let statusColor = '#E2E8F0'; let statusText = 'Afventer'; let statusColorText = '#64748B';
                    if(b.status === 'approved') { statusColor = '#DCFCE7'; statusText = 'Godkendt'; statusColorText = '#166534'; }
                    
                    html += `
                    <div class="ride-card" style="padding: 1.5rem;">
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <div style="display:flex; gap:15px;">
                                <div style="font-size:2.5rem;">👤</div>
                                <div>
                                    <div class="route-title">${ride.origin_city} ➝ ${ride.destination_city}</div>
                                    <div class="ride-meta">Chauffør: ${driver.full_name}</div>
                                    <div style="color:var(--accent); font-weight:700; margin-top:5px;">${formatDateTime(ride.departure_time)}</div>
                                </div>
                            </div>
                            <div style="text-align:right;">
                                <div class="ride-price">${ride.price_dkk} kr.</div>
                                <span style="display:inline-block; margin-top:5px; background:${statusColor}; color:${statusColorText}; padding:4px 8px; border-radius:6px; font-weight:700; font-size:0.8rem;">${statusText}</span>
                            </div>
                        </div>
                        
                        <div class="action-bar" style="margin-top: 20px;">
                            <a href="/chat?id=${ride.driver_id}" class="btn-outline" style="text-align:center; text-decoration:none;">💬 Chat</a>
                            <button class="btn-outline btn-danger" onclick="passengerCancelBooking('${b.id}', '${ride.departure_time}')">Aflys</button>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;

            } catch (err) {
                document.getElementById('passenger-rides-list').innerHTML = `<p style="color:red;text-align:center;">Fejl: ${err.message}</p>`;
            }
        }

        // ==========================================
        // 3. API & MODAL HANDLERS
        // ==========================================
        
        // MODAL
        let modalConfirmCallback = null;
        function showModal(title, text, btnText, callback) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('modalConfirmBtn').innerText = btnText;

        // CHAUFFØR: Afvis/Godkend Passager
        async function updateBooking(bookingId, newStatus, passengerName) {
            try {
                await _supabase.from('bookings').update({status: newStatus}).eq('id', bookingId);
                
                // Hvis afvist, frigiv penge
                if (newStatus === 'rejected') {
                    const { data } = await _supabase.from('bookings').select('stripe_payment_id').eq('id', bookingId).single();
                    if (data && data.stripe_payment_id) {
                        await _supabase.functions.invoke('settle-payment', { body: { paymentIntentId: data.stripe_payment_id, action: 'cancel' }});
                    }
                }
                alert(`${newStatus === 'approved' ? 'Godkendt' : 'Afvist'}: ${passengerName}`);
                fetchDriverRides(); // Genindlæs
            } catch(e) { alert("Fejl: " + e.message); }
        }

        // CHAUFFØR: Fjern Godkendt Passager
        function driverCancelPassenger(bookingId, name) {
            showModal("Fjern passager?", `Er du sikker på, at du vil fjerne ${name}?\nPassageren får alle sine penge tilbage.`, "Fjern passager", async () => {
                try {
                    await _supabase.functions.invoke('driver-cancel-booking', { body: { booking_id: bookingId }});
                    fetchDriverRides();
                } catch(e) { alert("Fejl: " + e.message); }

        }

        // PASSAGER: Aflys egen booking
        function passengerCancelBooking(bookingId, depTimeStr) {
            const depTime = new Date(depTimeStr);
            const hoursUntil = (depTime - new Date()) / (1000 * 60 * 60);

            if (hoursUntil < 0) return alert("Turen er startet.");
            
            let title = "Gratis afmelding ✅";
            let txt = "Du afmelder i god tid. Hele beløbet frigives på dit kort.";
            if (hoursUntil < 3) { title = "100% Gebyr ⚠️"; txt = "Under 3 timer til afgang. Ingen refundering."; }
            else if (hoursUntil < 24) { title = "50% Gebyr ⚠️"; txt = "Under 24 timer til afgang. Vi trækker halvdelen af prisen."; }

            showModal(title, txt, "Bekræft Aflysning", async () => {
                try {
                    const session = (await _supabase.auth.getSession()).data.session;
                    const jwt = session.access_token;
                    const res = await _supabase.functions.invoke('cancel-booking', {
                        body: { booking_id: bookingId },
                        headers: { Authorization: `Bearer ${jwt}` }
                    });
                    if(res.error) throw res.error;
                    alert("Din booking er aflyst.");
                    fetchPassengerRides();
                } catch(e) { alert("Fejl: " + e.message); }
            });
        }

        // ==========================================
        // 4. CO2 & AFREGNING (Komplet Oversættelse)
        // ==========================================
        
        // WKB Hex Parser til PostGIS POINT
        function parseHexPoint(hex) {
            if(!hex || typeof hex !== 'string') return {lng:0, lat:0};
            const cleanHex = hex.replace('\\x', '');
            if(cleanHex.length < 40) return {lng:0, lat:0}; // Simpel text POINT parse udeladt for kortheds skyld, antager Hex
            
            let bytes = new Uint8Array(cleanHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            let view = new DataView(bytes.buffer);
            let littleEndian = view.getUint8(0) === 1;
            // Float64 koordinater starter ved byte 9 og 17 i EWKB
            let lng = view.getFloat64(9, littleEndian);
            let lat = view.getFloat64(17, littleEndian);
            return {lng, lat};
        }

        async function fetchMapboxRoute(slng, slat, elng, elat, extraParams='') {
            try {
                const url = `https://api.mapbox.com/directions/v5/mapbox/driving-traffic/${slng},${slat};${elng},${elat}?access_token=${MAPBOX_TOKEN}${extraParams}`;
                const res = await fetch(url);
                const data = await res.json();
                if(data.routes && data.routes.length > 0) {
                    return data.routes.sort((a,b) => a.distance - b.distance)[0];
                }
            } catch(e) { console.error("Mapbox rute fejl:", e); }
            return null;
        }

        async function distributeCO2(rideId) {
            try {
                const { data: ride } = await _supabase.from('rides').select('*').eq('id', rideId).single();
                const { data: pax } = await _supabase.from('bookings').select('passenger_id').eq('ride_id', rideId).eq('status', 'approved');
                
                if(!pax || pax.length === 0) return;

                const start = parseHexPoint(ride.origin_location);
                const end = parseHexPoint(ride.destination_location);
                let distKm = 0;

                if (ride.is_ferry) {
                    // Simpel Færgelogik Jylland <-> Sjælland (Aarhus/Odden)
                    const isEast = start.lng < end.lng;
                    const p1 = isEast ? {lng: 10.213, lat: 56.157} : {lng: 11.296, lat: 55.973};
                    const p2 = isEast ? {lng: 11.296, lat: 55.973} : {lng: 10.213, lat: 56.157};

                    const r1 = await fetchMapboxRoute(start.lng, start.lat, p1.lng, p1.lat);
                    const r2 = await fetchMapboxRoute(p2.lng, p2.lat, end.lng, end.lat);
                    
                    if(r1 && r2) distKm = (r1.distance/1000) + (r2.distance/1000);
                } else {
                    const r = await fetchMapboxRoute(start.lng, start.lat, end.lng, end.lat, '&exclude=ferry');
                    if(r) distKm = r.distance / 1000;
                }

                if(distKm === 0) return;

                const co2Total = (distKm * 0.16) * pax.length;
                const share = co2Total / (pax.length + 1); // Delt med chauffør

                // Opdater DB
                await _supabase.rpc('increment_co2', {user_id: ride.driver_id, amount: share});
                for(let p of pax) {
                    await _supabase.rpc('increment_co2', {user_id: p.passenger_id, amount: share});
                }
                console.log("CO2 fordelt: ", share, "kg");
            } catch(e) { console.error("CO2 beregning fejlede:", e); }
        }

        async function completeTrip(rideId) {
            showModal("Afslut tur?", "Dette vil hæve pengene hos passagererne, udregne jeres CO2 og overføre beløbet til din Stripe-konto.", "Afslut nu", async () => {
                try {
                    // Capture betalinger
                    const { data: pax } = await _supabase.from('bookings').select('stripe_payment_id').eq('ride_id', rideId).eq('status', 'approved');
                    for (let p of (pax||[])) {
                        if(p.stripe_payment_id) {
                            await _supabase.functions.invoke('settle-payment', { body: { paymentIntentId: p.stripe_payment_id, action: 'capture' }});
                        }
                    }

                    // CO2
                    await distributeCO2(rideId);

                    // Payout (Edge Function)
                    const session = (await _supabase.auth.getSession()).data.session;
                    const res = await _supabase.functions.invoke('complete-trip', {
                        body: { trip_id: rideId },
                        headers: { Authorization: `Bearer ${session.access_token}` }
                    });

                    if(res.error) throw res.error;
                    
                    alert("Turen er afsluttet og afregnet! 💸");
                    window.location.href = `/review?id=${rideId}`; // Gå til anmeldelser
                } catch(e) { alert("Fejl: " + e.message); }
            });
        }
