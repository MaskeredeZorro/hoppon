<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoppOn - Denmark's Easiest Rideshare</title>
    <link rel="icon" href="https://i.imgur.com/4oGYz8n.png" type="image/png">
    
    <script src="/components.js" defer></script>

    <style>
        :root {
            /* HoppOn Brand Colors */
            --slate-900: #0F172A; /* Primary Text/Bg */
            --indigo-500: #6366F1; /* Brand Accent */
            --indigo-600: #4F46E5; /* Hover State */
            --slate-100: #F1F5F9;
            --white: #FFFFFF;
            
            /* Glassmorphism Settings */
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100%;
            background: radial-gradient(circle at top right, #E0E7FF 0%, #F8FAFC 60%, #FFFFFF 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            color: var(--slate-900);
            -webkit-font-smoothing: antialiased;
        }

        /* MAIN WRAPPER (Centers the card) */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 1rem 2rem 1rem; /* Padding top accounts for fixed header */
        }

        /* Main Card Container */
        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 3.5rem 2.5rem;
            border-radius: 32px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Logo Icon */
        .logo-container {
            width: 80px;
            height: 80px;
            background: transparent; 
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
            overflow: hidden;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--slate-900);
            letter-spacing: -1px;
            line-height: 1;
        }

        p.tagline {
            font-size: 1.1rem;
            color: #475569; /* Slate 600 */
            line-height: 1.5;
            margin-bottom: 0.5rem;
        }

        /* Feature Grid */
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin: 1rem 0;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .feature-icon {
            width: 24px;
            height: 24px;
            color: var(--indigo-500);
        }

        .feature-text {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--slate-900);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .divider {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(15, 23, 42, 0.1), transparent);
            margin: 0.5rem 0;
        }

        /* Button Group */
        .store-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--slate-900);
            color: var(--white);
            text-decoration: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: var(--indigo-500);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .btn.secondary {
            background: transparent;
            color: var(--slate-900);
            border: 2px solid var(--slate-900);
        }
        
        .btn.secondary:hover {
            background: var(--slate-100);
            border-color: var(--slate-900);
            box-shadow: none;
        }

        .store-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Desktop Optimization */
        @media (min-width: 600px) {
            .store-buttons {
                flex-direction: row;
                justify-content: center;
            }
            .container {
                padding: 4rem 3rem;
            }
        }
    </style>
</head>
<body>

    <hoppon-header></hoppon-header>

    <main>
        <div class="container">
            <div class="logo-container">
                <img src="https://i.imgur.com/4oGYz8n.png" alt="HoppOn Logo" class="logo-img">
            </div>

            <div>
                <h1>HoppOn</h1>
                <p class="tagline">Ride together. Save together.</p>
            </div>

            <div class="features">
                <div class="feature-item">
                    <svg class="feature-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z" />
                    </svg>
                    <span class="feature-text">Verified</span>
                </div>
                <div class="feature-item">
                    <svg class="feature-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 00-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 01-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 003 15h-.75M15 10.5a3 3 0 11-6 0 3 3 0 016 0zm3 0h.008v.008H18V10.5zm-12 0h.008v.008H6V10.5z" />
                    </svg>
                    <span class="feature-text">No Cash</span>
                </div>
                <div class="feature-item">
                    <svg class="feature-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 4.5v15m6-15v15m-10.875 0h15.75c.621 0 1.125-.504 1.125-1.125V5.625c0-.621-.504-1.125-1.125-1.125H4.125C3.504 4.5 3 5.004 3 5.625v12.75c0 .621.504 1.125 1.125 1.125z" />
                    </svg>
                    <span class="feature-text">Instant</span>
                </div>
            </div>

            <div class="divider"></div>

            <p style="font-size: 0.95rem; color: #64748B; margin-bottom: 0.5rem;">
                Denmark's new standard for ridesharing. <br>
                Pay automatically. Get paid instantly. <br>
                <strong>No friction. Just drive.</strong>
            </p>

            <div class="store-buttons">
                <a href="/lift" class="btn">
                    <svg xmlns="http://www.w3.org/2000/svg" class="store-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
                    Find et lift
                </a>

                <a href="/opret-tur" class="btn secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" class="store-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                    Udbyd en tur
                </a>
            </div>
        </div>
    </main>

    <hoppon-footer></hoppon-footer>

</body>
</html>
