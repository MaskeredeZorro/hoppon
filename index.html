<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoppOn - Denmark's Easiest Rideshare</title>
    <style>
        :root {
            /* HoppOn Brand Colors */
            --slate-900: #0F172A; /* Primary Text/Bg */
            --indigo-500: #6366F1; /* Brand Accent */
            --indigo-600: #4F46E5; /* Hover State */
            --slate-100: #F1F5F9;
            --white: #FFFFFF;
            
            /* Glassmorphism Settings */
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            width: 100%;
            /* Subtle gradient background matching the app's clean vibe */
            background: radial-gradient(circle at top right, #E0E7FF 0%, #F8FAFC 60%, #FFFFFF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--slate-900);
            overflow: hidden; /* Enforce no scrolling */
        }

        /* Main Card Container */
        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 3.5rem 2.5rem;
            border-radius: 32px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 480px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Logo Icon */
        .logo-container {
            width: 80px;
            height: 80px;
            background: var(--slate-900);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .logo-icon {
            color: var(--indigo-500);
            width: 40px;
            height: 40px;
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--slate-900);
            letter-spacing: -1px;
            line-height: 1;
        }

        p.tagline {
            font-size: 1.1rem;
            color: #475569; /* Slate 600 */
            line-height: 1.5;
            margin-bottom: 0.5rem;
        }

        /* Feature Grid (The "About" Section) */
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin: 1rem 0;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .feature-icon {
            width: 24px;
            height: 24px;
            color: var(--indigo-500);
        }

        .feature-text {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--slate-900);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .divider {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(15, 23, 42, 0.1), transparent);
            margin: 0.5rem 0;
        }

        /* Button Group */
        .store-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--slate-900);
            color: var(--white);
            text-decoration: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: var(--indigo-500);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .btn.secondary {
            background: transparent;
            color: var(--slate-900);
            border: 2px solid var(--slate-900);
        }
        
        .btn.secondary:hover {
            background: var(--slate-100);
            border-color: var(--slate-900);
            box-shadow: none;
        }

        /* Icons */
        .store-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Footer */
        footer {
            font-size: 0.75rem;
            color: #94A3B8; /* Slate 400 */
            margin-top: 1rem;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Desktop Optimization */
        @media (min-width: 600px) {
            .store-buttons {
                flex-direction: row;
            }
            .container {
                padding: 4rem 3rem;
            }
        }
    </style>
</head>
<body>

            <div class="feature-item">

        <div class="divider"></div>

        <p style="font-size: 0.95rem; color: #64748B; margin-bottom: 0.5rem;">
            Denmark's new standard for ridesharing. <br>
            Pay automatically. Get paid instantly. <br>
