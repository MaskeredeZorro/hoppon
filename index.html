<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoppOn - Download the App</title>
    <style>
        :root {
            /* Theme Variables - Easily adjustable */
            --primary-color: #0F172A; /* Deep slate/black for trust/finance */
            --accent-color: #3B82F6;  /* Vivid blue for action */
            --text-light: #F8FAFC;
            --text-dark: #1E293B;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            width: 100%;
            background: var(--bg-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Main Card Container */
        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 4rem 3rem;
            border-radius: var(--radius);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: fadeIn 1s ease-out;
        }

        /* Typography */
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }

        p.tagline {
            font-size: 1.25rem;
            color: var(--text-dark);
            opacity: 0.8;
            margin-bottom: 3rem;
            line-height: 1.5;
        }

        /* Button Group */
        .store-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--primary-color);
            color: var(--text-light);
            text-decoration: none;
            padding: 18px 24px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid transparent;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.15);
            background: var(--accent-color);
        }

        /* Icons (SVG) */
        .icon {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* Footer */
        footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: var(--text-dark);
            opacity: 0.5;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Adjustments */
        @media (min-width: 600px) {
            .store-buttons {
                flex-direction: row;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HoppOn</h1>
        <p class="tagline">Seamless payouts. Everything handled.</p>

        <div class="store-buttons">
            <a href="#" class="btn">
                <svg class="icon" viewBox="0 0 384 512">
                    <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5c0 66.2 23.9 122.2 52.4 167.7 20.3 32.9 56.7 81.9 90.5 81.3 28.3-.5 38.2-18.5 67.5-18.5 29.8 0 39 18.5 68.3 18.2 27.5-.3 52.4-38.6 74.3-70.8 13.9-20.7 24-42.5 24-42.5-3.3-1.6-67.7-27.5-68.3-95.9zM248.6 86.9c22-30 20.8-67.2 18.4-78.2-22.6 1.1-60.5 15.6-79.6 42-18.4 24.3-15.6 57.8-15.6 57.8 28.5 4.3 54.7-15.1 76.8-21.6z"/>
                </svg>
                App Store
            </a>

            <a href="#" class="btn">
                <svg class="icon" viewBox="0 0 512 512">
                    <path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/>
                </svg>
                Google Play
            </a>
        </div>

        <footer>
            &copy; 2026 HoppOn. All rights reserved.
        </footer>
    </div>

</body>
</html>
