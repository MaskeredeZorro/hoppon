<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bekræft SMS | HoppOn</title>
    <link rel="icon" href="https://i.imgur.com/4oGYz8n.png" type="image/png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/style.css">
    <script src="/supabase.js"></script>
    <script src="/components.js" defer></script>

    <style>
        /* Specifikke styles til Verificerings-kortet */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 1rem 2rem 1rem;
        }

        .verify-card { 
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 100%; 
            max-width: 420px; 
            border-radius: 32px; 
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15); 
            padding: 3rem 2.5rem; 
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .icon-bg { 
            background: #EEF2FF; 
            width: 80px; 
            height: 80px; 
            border-radius: 24px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.15);
        }
        .sms-icon { font-size: 2rem; }

        .verify-card h1 { 
            font-size: 1.8rem; 
            font-weight: 900; 
            margin-bottom: 0.5rem; 
            color: var(--brand);
            letter-spacing: -0.5px;
        }
        .subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: 1rem; line-height: 1.5; }

        .code-input { 
            width: 100%; 
            letter-spacing: 8px; 
            font-size: 1.8rem; 
            text-align: center; 
            font-weight: 900;
            padding: 16px; 
            border: 2px solid var(--border); 
            border-radius: 16px; 
            background: #F8FAFC;
            color: var(--brand);
            margin-bottom: 1.5rem; 
            transition: all 0.2s;
            outline: none;
        }
        .code-input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }

        .btn-verify { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            background: var(--brand); 
            color: white; 
            border: none; 
            border-radius: 16px; 
            font-size: 1.1rem; 
            font-weight: 800; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .btn-verify:hover { 
            background: var(--accent); 
            transform: translateY(-2px); 
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        #msgBox { 
            margin-top: 20px; 
            font-size: 0.9rem; 
            font-weight: 600;
            padding: 12px; 
            border-radius: 12px; 
            display: none; 
        }
        .msg-error { color: #EF4444; background: #FEF2F2; border: 1px solid #FCA5A5; }
        .msg-success { color: #10B981; background: #ECFDF5; border: 1px solid #A7F3D0; }

        /* Loading Overlay Global */
        #globalLoader { 
            position: fixed; 
            top:0; left:0; width:100%; height:100%; 
            background: rgba(255,255,255,0.9); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 2000; 
            flex-direction: column; 
            gap: 15px; 
            backdrop-filter: blur(5px);
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <div id="globalLoader">
        <div class="spinner"></div>
        <div style="font-weight: 700; color: var(--brand);">Verificerer...</div>
    </div>

    <hoppon-header></hoppon-header>

    <main>
        <div class="verify-card">
            <div class="icon-bg"><span class="sms-icon">📱</span></div>
            <h1>Tjek din SMS</h1>
            <p class="subtitle">Vi har sendt en 6-cifret kode til<br><strong id="phoneDisplay" style="color: var(--brand);">...</strong></p>

            <input type="text" id="codeInput" class="code-input" placeholder="000000" maxlength="6" inputmode="numeric">
            
            <button class="btn-verify" onclick="verifyCode()">Bekræft Kode</button>
            <div id="msgBox"></div>

            <div style="margin-top: 25px;">
                <a href="/login" style="font-size: 0.9rem; color: var(--text-muted); font-weight: 600; text-decoration: none; transition: 0.2s;">
                    &larr; Log ind igen / Skift nummer
                </a>
            </div>
        </div>
    </main>

    <hoppon-footer></hoppon-footer>

    <script>
        // Hent telefonnummer fra session storage (sat i login.html)
        const phone = sessionStorage.getItem('verify_phone');
        if (phone) document.getElementById('phoneDisplay').innerText = phone;

        function showMsg(text, isError) {
            const box = document.getElementById('msgBox');
            box.innerText = text;
            box.className = isError ? 'msg-error' : 'msg-success';
            box.style.display = 'block';
        }

        async function verifyCode() {
            const code = document.getElementById('codeInput').value.trim();
            if (code.length !== 6) { showMsg("Indtast venligst den 6-cifrede kode.", true); return; }

            document.getElementById('globalLoader').style.display = 'flex';

            try {
                // 1. Hent bruger
                const { data: { user } } = await _supabase.auth.getUser();
                if (!user) throw new Error("Du er blevet logget ud. Prøv igen.");

                // 2. Tjek koden i databasen
                const { data, error } = await _supabase
                    .from('sms_verifications')
                    .select('*')
                    .eq('user_id', user.id)
                    .eq('code', code)
                    .gt('expires_at', new Date().toISOString())
                    .order('created_at', { ascending: false })
                    .limit(1)
                    .single();

                if (error || !data) {
                    throw new Error("Forkert eller udløbet kode. Prøv igen.");
                }

                // 3. Opdater Profil (phone_verified = true)
                const { error: updateError } = await _supabase
                    .from('profiles')
                    .update({ phone_verified: true })
                    .eq('id', user.id);

                if (updateError) throw updateError;

                // 4. Succes!
                showMsg("Succes! Viderestiller...", false);
                setTimeout(() => {
                    window.location.href = '/opret-tur';
                }, 1000);

            } catch (e) {
                console.error(e);
                showMsg(e.message, true);
                document.getElementById('globalLoader').style.display = 'none';
            }
        }

        // Understøttelse af Enter-tast
        document.getElementById('codeInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') verifyCode();
        });
    </script>
</body>
</html>
