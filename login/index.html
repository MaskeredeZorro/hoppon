<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log ind | HoppOn</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="/supabase.js"></script>
    <script src="/components.js" defer></script>

    <style>
        /* Specifikke styles kun for Login-siden (overskriver evt. globale ting blødt) */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 1rem 2rem 1rem;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 100%;
            max-width: 420px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
            padding: 3rem 2.5rem;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-card h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            text-align: center;
            color: var(--brand);
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 1rem;
            background: #F8FAFC;
            color: var(--brand);
            font-weight: 500;
            transition: all 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .footer-link {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
        }

        #errorMessage {
            color: #EF4444; /* Tailwind Red 500 */
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 15px;
            text-align: center;
            display: none;
            background: #FEF2F2;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #FCA5A5;
        }

        /* Loading Overlay Global */
        #globalLoader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        .loading-text { font-weight: 700; color: var(--brand); font-size: 1.1rem;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <div id="globalLoader">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Logger ind...</div>
    </div>

    <hoppon-header></hoppon-header>

    <main>
        <div class="login-card">
            <h1>Velkommen tilbage</h1>
            <p class="subtitle">Log ind for at køre med</p>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="din@email.dk" required>
            </div>

            <div class="form-group">
                <label>Adgangskode</label>
                <input type="password" id="loginPass" placeholder="••••••••" required>
            </div>

            <div id="errorMessage"></div>

            <button class="btn-submit" onclick="handleLogin()">Log ind</button>
            
            <div class="footer-link">
                Har du ikke en konto? <a href="/opret-profil">Opret profil her</a>
            </div>
        </div>
    </main>

    <hoppon-footer></hoppon-footer>

    <script>
        // BEMÆRK: Vi behøver ikke definere _supabase her. 
        // Den hentes automatisk fra /supabase.js, som ligger i <head>.
        // Så _supabase virker "out of the box"!

        function setLoading(isLoading, text = "Arbejder...") {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('globalLoader').style.display = isLoading ? 'flex' : 'none';
        }

        function showError(msg) {
            const errDiv = document.getElementById('errorMessage');
            errDiv.innerText = msg;
            errDiv.style.display = 'block';
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            
            if (!email || !pass) { showError("Indtast venligst email og adgangskode."); return; }

            setLoading(true, "Logger ind...");
            document.getElementById('errorMessage').style.display = 'none';

            try {
                // 1. LOG IND
                const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({
                    email: email, password: pass
                });

                if (authError) {
                    if (authError.message.includes("Email not confirmed")) {
                        throw new Error("Bekræft venligst din email før du logger ind. Tjek din indbakke.");
                    } else if (authError.message.includes("Invalid login credentials")) {
                        throw new Error("Forkert email eller adgangskode.");
                    } else {
                        throw authError;
                    }
                }

                const userId = authData.user.id;

                // 2. TJEK PROFIL STATUS (phone_verified)
                setLoading(true, "Tjekker status...");
                const { data: profile, error: profileError } = await _supabase
                    .from('profiles')
                    .select('phone_verified, phone_number, full_name')
                    .eq('id', userId)
                    .single();

                if (profileError) throw profileError;

                if (profile.phone_verified) {
                    // ALL GOOD -> Forsiden / Lift-siden
                    window.location.href = '/lift';
                } else {
                    // MANGLER VERIFICERING -> Send SMS
                    await sendVerificationSMS(userId, profile.phone_number);
                }

            } catch (e) {
                console.error(e);
                showError(e.message);
                setLoading(false);
            }
        }

        async function sendVerificationSMS(userId, phoneNumber) {
            if (!phoneNumber) {
                throw new Error("Ingen telefonnummer fundet på profilen. Kontakt support.");
            }

            setLoading(true, "Sender SMS kode...");

            // Generer 6-cifret kode (Samme logik som Flutter appen)
            const code = Math.floor(100000 + Math.random() * 900000).toString();

            // 1. Gem kode i databasen
            const expiresAt = new Date();
            expiresAt.setMinutes(expiresAt.getMinutes() + 10); // Udløber om 10 min

            const { error: dbError } = await _supabase.from('sms_verifications').insert({
                user_id: userId,
                code: code,
                expires_at: expiresAt.toISOString()
            });

            if (dbError) throw new Error("Kunne ikke gemme sikkerhedskode: " + dbError.message);

            // 2. Kald Edge Function
            const { data, error: funcError } = await _supabase.functions.invoke('send-verification-sms', {
                body: { phoneNumber: phoneNumber, code: code }
            });

            if (funcError) {
                throw new Error("Kunne ikke sende SMS. Prøv igen senere.");
            }

            // 3. Send til Verificerings-side
            // Vi gemmer midlertidigt telefonnummeret i session storage så vi kan vise det på næste side
            sessionStorage.setItem('verify_phone', phoneNumber);
            window.location.href = '/verification';
        }

        // Enter tast support
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
