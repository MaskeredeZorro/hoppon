<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log ind | HoppOn</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --brand: #4F46E5;
            --brand-dark: #4338ca;
            --dark: #0F172A;
            --light: #F8FAFC;
            --text: #334155;
            --text-light: #64748B;
            --border: #E2E8F0;
            --error: #EF4444;
            --success: #10B981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #F3F4F6; color: var(--dark); min-height: 100vh; display: flex; flex-direction: column; }

        .navbar { background: white; padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: center; }
        .logo { font-weight: 800; font-size: 1.5rem; color: var(--brand); text-decoration: none; }

        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem 1rem; }
        .login-card { background: white; width: 100%; max-width: 400px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); padding: 2.5rem; }

        h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; text-align: center; }
        .subtitle { text-align: center; color: var(--text-light); margin-bottom: 2rem; font-size: 0.95rem; }

        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
        input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 1rem; background: var(--light); transition: all 0.2s; }
        input:focus { outline: none; border-color: var(--brand); background: white; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        .btn-submit { display: block; width: 100%; padding: 16px; background: var(--brand); color: white; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 1rem; transition: transform 0.2s; }
        .btn-submit:hover { background: var(--brand-dark); transform: translateY(-1px); }

        .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-light); }
        .footer-link a { color: var(--brand); text-decoration: none; font-weight: 600; }

        #errorMessage { color: var(--error); font-size: 0.85rem; margin-top: 10px; text-align: center; display: none; background: #FEF2F2; padding: 10px; border-radius: 8px; }

        /* Loading Overlay */
        #loadingOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.9); display: none; justify-content: center; align-items: center; z-index: 100; flex-direction: column; gap: 15px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--brand); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-weight: 600; color: var(--text); }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Logger ind...</div>
    </div>

    <nav class="navbar">
        <a href="#" class="logo">HoppOn</a>
    </nav>

    <div class="main-container">
        <div class="login-card">
            <h1>Velkommen tilbage</h1>
            <p class="subtitle">Log ind for at køre med</p>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="din@email.dk" required>
            </div>

            <div class="form-group">
                <label>Adgangskode</label>
                <input type="password" id="loginPass" placeholder="******" required>
            </div>

            <div id="errorMessage"></div>

            <button class="btn-submit" onclick="handleLogin()">Log ind</button>
            
            <div class="footer-link">
                Har du ikke en konto? <a href="https://hoppon.dk/opret-profil">Opret profil her</a>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xboklywxcozobvfrptpr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_amqWmR5MrUSFHlniU2yp3Q_c8kUysEY'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function setLoading(isLoading, text = "Arbejder...") {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = isLoading ? 'flex' : 'none';
        }

        function showError(msg) {
            const errDiv = document.getElementById('errorMessage');
            errDiv.innerText = msg;
            errDiv.style.display = 'block';
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            
            if (!email || !pass) { showError("Indtast venligst email og adgangskode."); return; }

            setLoading(true, "Logger ind...");
            document.getElementById('errorMessage').style.display = 'none';

            try {
                // 1. LOG IND
                const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({
                    email: email, password: pass
                });

                if (authError) {
                    if (authError.message.includes("Email not confirmed")) {
                        throw new Error("Bekræft venligst din email før du logger ind. Tjek din indbakke.");
                    } else if (authError.message.includes("Invalid login credentials")) {
                        throw new Error("Forkert email eller adgangskode.");
                    } else {
                        throw authError;
                    }
                }

                const userId = authData.user.id;

                // 2. TJEK PROFIL STATUS (phone_verified)
                setLoading(true, "Tjekker status...");
                const { data: profile, error: profileError } = await _supabase
                    .from('profiles')
                    .select('phone_verified, phone_number, full_name')
                    .eq('id', userId)
                    .single();

                if (profileError) throw profileError;

                if (profile.phone_verified) {
                    // ALL GOOD -> Forsiden
                    window.location.href = 'index.html';
                } else {
                    // MANGLER VERIFICERING -> Send SMS
                    await sendVerificationSMS(userId, profile.phone_number);
                }

            } catch (e) {
                console.error(e);
                showError(e.message);
                setLoading(false);
            }
        }

        async function sendVerificationSMS(userId, phoneNumber) {
            if (!phoneNumber) {
                throw new Error("Ingen telefonnummer fundet på profilen. Kontakt support.");
            }

            setLoading(true, "Sender SMS kode...");

            // Generer 6-cifret kode (Samme logik som Flutter appen)
            const code = Math.floor(100000 + Math.random() * 900000).toString();

            // 1. Gem kode i databasen
            const expiresAt = new Date();
            expiresAt.setMinutes(expiresAt.getMinutes() + 10); // Udløber om 10 min

            const { error: dbError } = await _supabase.from('sms_verifications').insert({
                user_id: userId,
                code: code,
                expires_at: expiresAt.toISOString()
            });

            if (dbError) throw new Error("Kunne ikke gemme sikkerhedskode: " + dbError.message);

            // 2. Kald Edge Function
            const { data, error: funcError } = await _supabase.functions.invoke('send-verification-sms', {
                body: { phoneNumber: phoneNumber, code: code }
            });

            if (funcError) {
                throw new Error("Kunne ikke sende SMS. Prøv igen senere.");
            }

            // 3. Send til Verificerings-side
            // Vi gemmer midlertidigt telefonnummeret i session storage så vi kan vise det på næste side
            sessionStorage.setItem('verify_phone', phoneNumber);
            window.location.href = 'verification.html';
        }

        // Enter tast support
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
