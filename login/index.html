<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log ind | HoppOn</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="/supabase.js"></script>
    <script src="/components.js" defer></script>

    <style>
        /* Specifikke styles kun for Login-siden */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 1rem 2rem 1rem;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 100%;
            max-width: 420px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
            padding: 3rem 2.5rem;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .login-card h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            text-align: center;
            color: var(--brand);
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 1rem;
            background: #F8FAFC;
            color: var(--brand);
            font-weight: 500;
            transition: all 0.2s;
            outline: none;
            box-sizing: border-box; /* Sikrer at padding ikke gør feltet bredere */
        }

        .form-group input:focus {
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        /* Glemt kode link styler */
        .forgot-password-link {
            position: absolute;
            right: 0;
            top: 0;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
        }

        .forgot-password-link:hover {
            text-decoration: underline;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: #F1F5F9;
            color: var(--text-main);
            margin-top: 10px;
        }
        
        .btn-secondary:hover {
            background: #E2E8F0;
            box-shadow: none;
            color: var(--brand);
        }

        .footer-link {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }

        .message-box {
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 15px;
            text-align: center;
            display: none;
            padding: 12px;
            border-radius: 12px;
        }

        .error-msg {
            color: #EF4444; 
            background: #FEF2F2;
            border: 1px solid #FCA5A5;
        }

        .success-msg {
            color: #10B981;
            background: #ECFDF5;
            border: 1px solid #6EE7B7;
        }

        /* Skjuler elementer */
        .hidden {
            display: none !important;
        }

        /* Loading Overlay Global */
        #globalLoader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        .loading-text { font-weight: 700; color: var(--brand); font-size: 1.1rem;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <div id="globalLoader">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Logger ind...</div>
    </div>

    <hoppon-header></hoppon-header>

    <main>
        <div class="login-card">
            
            <div id="loginView">
                <h1>Velkommen tilbage</h1>
                <p class="subtitle">Log ind for at køre med</p>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="din@email.dk" required>
                </div>

                <div class="form-group">
                    <label>Adgangskode</label>
                    <a class="forgot-password-link" onclick="toggleView('resetView')">Glemt kode?</a>
                    <input type="password" id="loginPass" placeholder="••••••••" required>
                </div>

                <div id="loginMessage" class="message-box error-msg"></div>

                <button class="btn-submit" onclick="handleLogin()">Log ind</button>
                
                <div class="footer-link">
                    Har du ikke en konto? <a href="/opret-profil">Opret profil her</a>
                </div>
            </div>

            <div id="resetView" class="hidden">
                <h1>Glemt kode?</h1>
                <p class="subtitle">Indtast din email, så sender vi et link til at lave en ny adgangskode.</p>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="resetEmail" placeholder="din@email.dk" required>
                </div>

                <div id="resetMessage" class="message-box"></div>

                <button class="btn-submit" onclick="handleResetPassword()">Send link</button>
                <button class="btn-submit btn-secondary" onclick="toggleView('loginView')">Tilbage til log ind</button>
            </div>

        </div>
    </main>

    <hoppon-footer></hoppon-footer>

    <script>
        function setLoading(isLoading, text = "Arbejder...") {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('globalLoader').style.display = isLoading ? 'flex' : 'none';
        }

        function showMessage(elementId, msg, isSuccess = false) {
            const el = document.getElementById(elementId);
            el.innerText = msg;
            el.className = isSuccess ? 'message-box success-msg' : 'message-box error-msg';
            el.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('loginMessage').style.display = 'none';
            document.getElementById('resetMessage').style.display = 'none';
        }

        // Skift mellem Login og Glemt Kode visning
        function toggleView(viewId) {
            hideMessages();
            if (viewId === 'resetView') {
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('resetView').classList.remove('hidden');
                // Kopier email fra login feltet hvis brugeren har tastet noget
                document.getElementById('resetEmail').value = document.getElementById('loginEmail').value;
            } else {
                document.getElementById('resetView').classList.add('hidden');
                document.getElementById('loginView').classList.remove('hidden');
            }
        }

        // ====== LOGIN LOGIK ======
        async function handleLogin() {
            hideMessages();
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            
            if (!email || !pass) { showMessage('loginMessage', "Indtast venligst email og adgangskode."); return; }

            setLoading(true, "Logger ind...");

            try {
                const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({
                    email: email, password: pass
                });

                if (authError) {
                    if (authError.message.includes("Email not confirmed")) {
                        throw new Error("Bekræft venligst din email før du logger ind. Tjek din indbakke.");
                    } else if (authError.message.includes("Invalid login credentials")) {
                        throw new Error("Forkert email eller adgangskode.");
                    } else {
                        throw authError;
                    }
                }

                const userId = authData.user.id;

                setLoading(true, "Tjekker status...");
                const { data: profile, error: profileError } = await _supabase
                    .from('profiles')
                    .select('phone_verified, phone_number, full_name')
                    .eq('id', userId)
                    .single();

                if (profileError) throw profileError;

                if (profile.phone_verified) {
                    window.location.href = '/lift';
                } else {
                    await sendVerificationSMS(userId, profile.phone_number);
                }

            } catch (e) {
                console.error(e);
                showMessage('loginMessage', e.message);
                setLoading(false);
            }
        }

        // ====== GENDAN KODE LOGIK ======
        async function handleResetPassword() {
            hideMessages();
            const email = document.getElementById('resetEmail').value.trim();
            
            if (!email) { showMessage('resetMessage', "Indtast venligst din email."); return; }

            setLoading(true, "Sender link...");

            try {
                // Kalder Supabase for at sende mailen.
                // VIGTIGT: Husk at oprette filen 'nulstil-kode.html' på din server,
                // og tilføj URL'en til "Redirect URLs" i Supabase settings!
                const { error } = await _supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: 'https://hoppon.dk/nulstil-kode.html', 
                });

                if (error) throw error;

                // Vis succes besked
                showMessage('resetMessage', "Vi har sendt et link til din mail. Husk at tjekke spam-mappen.", true);
                
                // Ryd feltet
                document.getElementById('resetEmail').value = '';

            } catch (e) {
                console.error(e);
                showMessage('resetMessage', "Der opstod en fejl: " + e.message);
            } finally {
                setLoading(false);
            }
        }

        async function sendVerificationSMS(userId, phoneNumber) {
            if (!phoneNumber) throw new Error("Ingen telefonnummer fundet på profilen. Kontakt support.");
            
            setLoading(true, "Sender SMS kode...");
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            const expiresAt = new Date();
            expiresAt.setMinutes(expiresAt.getMinutes() + 10); 

            const { error: dbError } = await _supabase.from('sms_verifications').insert({
                user_id: userId, code: code, expires_at: expiresAt.toISOString()
            });

            if (dbError) throw new Error("Kunne ikke gemme sikkerhedskode: " + dbError.message);

            const { data, error: funcError } = await _supabase.functions.invoke('send-verification-sms', {
                body: { phoneNumber: phoneNumber, code: code }
            });

            if (funcError) throw new Error("Kunne ikke sende SMS. Prøv igen senere.");

            sessionStorage.setItem('verify_phone', phoneNumber);
            window.location.href = '/verification';
        }

        // Enter tast support (Tjekker hvilken view der er aktiv)
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                if (document.getElementById('resetView').classList.contains('hidden')) {
                    handleLogin();
                } else {
                    handleResetPassword();
                }
            }
        });
    </script>
</body>
</html>
