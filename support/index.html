<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - HoppOn</title>
    <link rel="icon" href="https://i.imgur.com/4oGYz8n.png" type="image/png">
    <style>
        :root {
            /* HoppOn Brand Colors */
            --slate-900: #0F172A;
            --indigo-500: #6366F1;
            --indigo-600: #4F46E5;
            --slate-100: #F1F5F9;
            --white: #FFFFFF;
            
            /* Glassmorphism Settings */
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            width: 100%;
            background: radial-gradient(circle at top right, #E0E7FF 0%, #F8FAFC 60%, #FFFFFF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--slate-900);
            overflow: hidden;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 3.5rem 2.5rem;
            border-radius: 32px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 480px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-container {
            width: 80px;
            height: 80px;
            background: transparent; 
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
            overflow: hidden;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--slate-900);
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        p.tagline {
            font-size: 1.1rem;
            color: #475569;
            line-height: 1.5;
        }

        .divider {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(15, 23, 42, 0.1), transparent);
            margin: 0.5rem 0;
        }

        .contact-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--slate-900);
            color: var(--white);
            text-decoration: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: var(--indigo-500);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .btn.secondary {
            background: transparent;
            color: var(--slate-900);
            border: 2px solid var(--slate-900);
        }
        
        .btn.secondary:hover {
            background: var(--slate-100);
            border-color: var(--slate-900);
            box-shadow: none;
        }

        .icon {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        footer {
            font-size: 0.75rem;
            color: #94A3B8;
            margin-top: 1rem;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (min-width: 600px) {
            .contact-buttons {
                flex-direction: row;
            }
            .btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="https://i.imgur.com/4oGYz8n.png" alt="HoppOn Logo" class="logo-img">
        </div>

        <div>
            <h1>Support</h1>
            <p class="tagline">Brug for hjælp? Vi sidder klar.</p>
        </div>

        <div class="divider"></div>

        <p style="font-size: 1rem; color: #64748B; margin-bottom: 0.5rem;">
            Har du spørgsmål til din tur, betaling eller appen? <br>
            <strong>Kontakt os direkte her:</strong>
        </p>

        <div class="contact-buttons">
            <a href="mailto:hej@hoppon.dk" class="btn">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
                hej@hoppon.dk
            </a>

            <a href="tel:26477774" class="btn secondary">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.81 12.81 0 00.63 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.63A2 2 0 0122 16.92z"/>
                </svg>
                26 47 77 74
            </a>
        </div>

        <footer>
            &copy; 2026 HoppOn. <br> Vi svarer typisk indenfor få timer.
        </footer>
    </div>

</body>
</html>
