<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opret Tur | HoppOn Samkørsel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #0F172A; --accent: #6366F1; --bg-color: #F8FAFC;
            --card-bg: #FFFFFF; --text-main: #334155; --text-light: #64748B;
            --danger: #EF4444; --success: #10B981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-color); color: var(--primary); padding-bottom: 4rem; }
        .header { background: var(--primary); color: white; padding: 3rem 1.5rem 6rem 1.5rem; text-align: center; clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%); }
        .header h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; }
        .container { max-width: 600px; margin: -4rem auto 0; padding: 0 1rem; position: relative; z-index: 10; }
        .card { background: white; border-radius: 20px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); margin-bottom: 2rem; display: none; }
        .card.active { display: block; }
        h2 { font-size: 1.5rem; margin-bottom: 1.5rem; color: var(--primary); border-bottom: 2px solid #F1F5F9; padding-bottom: 10px; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin: 1.5rem 0 0.8rem 0; color: var(--primary); }
        .form-group { margin-bottom: 1rem; position: relative; }
        label { display: block; font-size: 0.9rem; color: var(--text-light); margin-bottom: 0.4rem; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 12px 16px; border: 1px solid #E2E8F0; border-radius: 12px; font-size: 1rem; background: #F8FAFC; }
        .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; text-align: center; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-outline { background: transparent; border: 2px solid #E2E8F0; color: var(--text-light); margin-top: 10px; }
        .suggestions-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #E2E8F0; border-radius: 12px; max-height: 200px; overflow-y: auto; z-index: 50; display: none; }
        .suggestion-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #F1F5F9; display: flex; align-items: center; gap: 10px; }
        .price-selector { display: flex; align-items: center; justify-content: space-between; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 5px; }
        .price-btn { width: 40px; height: 40px; border-radius: 8px; border: none; background: white; cursor: pointer; }
        .price-value { font-weight: 800; font-size: 1.2rem; }
        .switch-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px; margin-bottom: 10px; background: white; }
        .toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }
        .rules-grid { display: flex; gap: 10px; margin-bottom: 10px; }
        .rule-btn { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid; text-align: center; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .rule-true { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); }
        .rule-false { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); color: #64748B; }
        #loadingOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 100; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadingOverlay"><div class="spinner"></div></div>

    <div class="header">
        <h1>Opret din tur</h1>
        <p>Tilbyd et lift, del udgifterne og gør en forskel.</p>
    </div>

    <div class="container">
        <div id="authSection" class="card">
            <h2 id="authTitle">Log ind for at oprette</h2>
            <div id="loginForm">
                <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="navn@mail.dk"></div>
                <div class="form-group"><label>Adgangskode</label><input type="password" id="loginPass" placeholder="******"></div>
                <button class="btn btn-primary" onclick="handleLogin()">Log Ind</button>
                <div style="text-align:center; margin-top:1rem; cursor:pointer; color:var(--accent);" onclick="toggleAuthMode('signup')">Ny her? Opret konto</div>
            </div>
            </div>

        <div id="createRideForm" class="card">
            <h2>Hvor skal du hen?</h2>
            <div class="section-title">Ruten</div>
            <div class="form-group">
                <label>Fra</label>
                <input type="text" id="originInput" placeholder="By eller station..." oninput="handleSearch(this, 'origin')">
                <div id="originSuggestions" class="suggestions-list"></div>
            </div>
            <div class="form-group">
                <label>Til</label>
                <input type="text" id="destInput" placeholder="By eller station..." oninput="handleSearch(this, 'dest')">
                <div id="destSuggestions" class="suggestions-list"></div>
            </div>

            <div class="section-title">Tidspunkt</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group"><label>Dato</label><input type="date" id="rideDate"></div>
                <div class="form-group"><label>Afgang</label><input type="time" id="rideTime"></div>
            </div>

            <div class="section-title">Pladser & Pris</div>
            <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 15px;">
                <div class="form-group"><label>Sæder</label><input type="number" id="seatsInput" value="3" min="1" max="7"></div>
                <div class="form-group">
                    <label>Pris (kr)</label>
                    <div class="price-selector">
                        <button class="price-btn" onclick="adjustPrice(-5)">-</button>
                        <div class="price-value" id="priceDisplay">0</div>
                        <button class="price-btn" onclick="adjustPrice(5)">+</button>
                    </div>
                </div>
            </div>
            <div id="payoutText" style="font-size:0.8rem; color:var(--text-light); text-align:right; font-style:italic;">Du får udbetalt 0 kr.</div>

            <button class="btn btn-primary" style="margin-top: 30px;" onclick="submitRide()">OFFENTLIGGØR TUR</button>
            <button class="btn btn-outline" onclick="logout()">Log ud</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xboklywxcozobvfrptpr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_amqWmR5MrUSFHlniU2yp3Q_c8kUysEY'; 
        const MAPBOX_TOKEN = 'pk.eyJ1IjoiaG9wcG9uIiwiYSI6ImNtbGpxd2dvNDAybmkzZXBnMnE3emFtY3oifQ.125QBf3ZNc7sCVxuBwnCnA';
        
        // FIX: Omdøbt fra 'supabase' til '_supabase' for at undgå ReferenceError
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentPrice = 0;
        let cachedDistanceKm = 0;
        let originCoords = null; 
        let destCoords = null;

        window.onload = async () => {
            setLoading(true);
            
            // Tjek om brugeren er logget ind
            const { data: { session } } = await _supabase.auth.getSession();
            
            if (session) {
                console.log("Bruger fundet:", session.user.email);
                currentUser = session.user;
                await fetchUserProfile(currentUser.id);
                showSection('createRideForm');
            } else {
                console.log("Ingen aktiv session - viser login.");
                showSection('authSection');
            }

            // Sæt standard dato/tid
            const now = new Date();
            document.getElementById('rideDate').valueAsDate = now;
            document.getElementById('rideTime').value = new Date(now.getTime() + 3600000).toTimeString().substring(0,5);
            
            setLoading(false);
        };

        async function handleLogin() {
            setLoading(true);
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password: pass });
            
            if (error) {
                alert("Login fejl: " + error.message);
            } else {
                currentUser = data.user;
                await fetchUserProfile(currentUser.id);
                showSection('createRideForm');
            }
            setLoading(false);
        }

        async function fetchUserProfile(userId) {
            const { data } = await _supabase.from('profiles').select('*').eq('id', userId).single();
            if (data && (data.gender === 'Kvinde')) {
                // Vis ladies only knap hvis relevant
            }
        }

        function showSection(id) {
            document.querySelectorAll('.card').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function setLoading(isLoading) {
            document.getElementById('loadingOverlay').style.display = isLoading ? 'flex' : 'none';
        }

        // --- MAPBOX & PRICE LOGIC (Samme som før, bare med _supabase) ---
        async function handleSearch(input, type) {
            const query = input.value;
            if (query.length < 2) return;
            const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${MAPBOX_TOKEN}&country=dk&limit=3`;
            const res = await fetch(url);
            const data = await res.json();
            const listEl = document.getElementById(type + 'Suggestions');
            listEl.innerHTML = '';
            data.features.forEach(feat => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerText = feat.place_name;
                div.onclick = () => {
                    input.value = feat.place_name;
                    listEl.style.display = 'none';
                    if (type === 'origin') originCoords = {lng: feat.center[0], lat: feat.center[1]};
                    else destCoords = {lng: feat.center[0], lat: feat.center[1]};
                    calculateRoute();
                };
                listEl.appendChild(div);
            });
            listEl.style.display = 'block';
        }

        async function calculateRoute() {
            if (!originCoords || !destCoords) return;
            const url = `https://api.mapbox.com/directions/v5/mapbox/driving/${originCoords.lng},${originCoords.lat};${destCoords.lng},${destCoords.lat}?access_token=${MAPBOX_TOKEN}`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.routes[0]) {
                cachedDistanceKm = data.routes[0].distance / 1000;
                currentPrice = Math.round(cachedDistanceKm * 1.07);
                updatePriceUI();
            }
        }

        function adjustPrice(amt) { currentPrice += amt; updatePriceUI(); }
        function updatePriceUI() {
            document.getElementById('priceDisplay').innerText = currentPrice;
            document.getElementById('payoutText').innerText = `Du får udbetalt ${Math.max(0, currentPrice - 15)} kr. pr. passager`;
        }

        async function submitRide() {
            if (!currentUser) return;
            setLoading(true);
            const { error } = await _supabase.from('rides').insert({
                driver_id: currentUser.id,
                origin_city: document.getElementById('originInput').value,
                destination_city: document.getElementById('destInput').value,
                departure_time: new Date(`${document.getElementById('rideDate').value}T${document.getElementById('rideTime').value}`).toISOString(),
                seats_available: parseInt(document.getElementById('seatsInput').value),
                price_dkk: currentPrice,
                status: 'active'
            });

            if (error) alert("Fejl: " + error.message);
            else { alert("Tur oprettet! 🚀"); location.reload(); }
            setLoading(false);
        }

        async function logout() { await _supabase.auth.signOut(); location.reload(); }
    </script>
</body>
</html>
