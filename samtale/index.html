<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Samtale | HoppOn</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/style.css">
    <script src="/supabase.js"></script>
    <script src="/components.js" defer></script>

    <style>
        body, html { height: 100%; margin: 0; background: #F8FAFC; overflow: hidden; }
        
        main {
            display: flex;
            justify-content: center;
            height: 100vh;
            padding-top: 80px; /* Plads til header */
            padding-bottom: 20px;
        }

        .chat-container {
            background: white;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            overflow: hidden;
            margin: 0 10px;
            height: calc(100vh - 100px);
        }

        /* --- HEADER --- */
        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
            background: white;
            z-index: 10;
        }

        .btn-back {
            background: #F1F5F9;
            border: none;
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--brand);
            transition: 0.2s;
        }
        .btn-back:hover { background: #E2E8F0; }

        .chat-avatar {
            width: 45px; height: 45px;
            border-radius: 50%;
            background: #E2E8F0;
            object-fit: cover;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #64748B;
        }

        .chat-name { font-weight: 800; font-size: 1.1rem; color: var(--brand); margin: 0;}
        .chat-sub { font-size: 0.8rem; color: var(--success); font-weight: 600; }

        /* --- BESKED-OMRÅDE --- */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #F8FAFC;
        }

        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .msg-wrapper.me { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.other { align-self: flex-start; align-items: flex-start; }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg-wrapper.me .msg-bubble {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-wrapper.other .msg-bubble {
            background: white;
            color: var(--brand);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .msg-time {
            font-size: 0.7rem;
            color: #94A3B8;
            margin-top: 5px;
            font-weight: 500;
        }

        /* --- INPUT-OMRÅDE --- */
        .chat-input-area {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            background: #F1F5F9;
            border: 1px solid transparent;
            border-radius: 20px;
            padding: 14px 20px;
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            max-height: 120px;
            outline: none;
            transition: 0.2s;
        }
        .chat-input:focus {
            background: white;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .btn-send {
            background: var(--brand);
            color: white;
            border: none;
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .btn-send:hover { background: var(--accent); transform: scale(1.05); }
        .btn-send:disabled { background: #CBD5E1; cursor: not-allowed; transform: none; }

        /* Loader */
        .loading-chat { text-align: center; color: var(--text-muted); padding: 2rem; font-weight: 600; }
        
        @media (max-width: 600px) {
            main { padding-top: 60px; padding-bottom: 0; }
            .chat-container { margin: 0; border-radius: 0; border: none; height: calc(100vh - 60px); }
            .chat-input-area { padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>

    <hoppon-header></hoppon-header>

    <main>
        <div class="chat-container">
            
            <div class="chat-header">
                <button class="btn-back" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></button>
                <img src="" id="ui-avatar" class="chat-avatar" style="display:none;">
                <div id="ui-avatar-placeholder" class="chat-avatar">👤</div>
                <div>
                    <h2 class="chat-name" id="ui-name">Henter...</h2>
                    <div class="chat-sub" id="ui-status"></div>
                </div>
            </div>

            <div class="chat-messages" id="chatWindow">
                <div class="loading-chat">Henter samtale...</div>
            </div>

            <div class="chat-input-area">
                <textarea id="msgInput" class="chat-input" rows="1" placeholder="Skriv en besked..." oninput="autoGrow(this)"></textarea>
                <button class="btn-send" id="sendBtn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>

        </div>
    </main>

    <script>
        let myUserId = null;
        let otherUserId = null;
        let rideId = null;

        window.onload = async () => {
            if (typeof _supabase === 'undefined') return;
            
            // 1. Tjek login
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                alert("Du skal være logget ind for at læse beskeder.");
                window.location.href = '/login';
                return;
            }
            myUserId = session.user.id;

            // 2. Hent data fra URL'en
            const urlParams = new URLSearchParams(window.location.search);
            otherUserId = urlParams.get('user');
            rideId = urlParams.get('ride'); // Kan være null

            if (!otherUserId) {
                alert("Ingen modtager valgt.");
                window.location.href = '/beskeder.html'; // Send tilbage til indbakken
                return;
            }

            // 3. Opsætning
            await loadOtherProfile();
            await markMessagesAsRead();
            await loadMessages();

            // Gør det muligt at trykke "Enter" for at sende
            document.getElementById('msgInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        };

        async function loadOtherProfile() {
            if (otherUserId === 'system_hoppon') {
                document.getElementById('ui-name').innerText = "HoppOn Support";
                document.getElementById('ui-status').innerText = "Systembeskeder";
                document.getElementById('msgInput').disabled = true;
                document.getElementById('msgInput').placeholder = "Du kan ikke svare på systembeskeder.";
                document.getElementById('sendBtn').disabled = true;
                return;
            }

            const { data: profile } = await _supabase.from('profiles').select('full_name, avatar_url').eq('id', otherUserId).single();
            if (profile) {
                document.getElementById('ui-name').innerText = profile.full_name || "Bruger";
                if (profile.avatar_url) {
                    document.getElementById('ui-avatar').src = profile.avatar_url;
                    document.getElementById('ui-avatar').style.display = 'flex';
                    document.getElementById('ui-avatar-placeholder').style.display = 'none';
                }
            } else {
                document.getElementById('ui-name').innerText = "Slettet bruger";
            }
        }

        async function markMessagesAsRead() {
            if (otherUserId === 'system_hoppon') return;
            await _supabase.from('messages')
                .update({ is_read: true })
                .eq('receiver_id', myUserId)
                .eq('sender_id', otherUserId)
                .eq('is_read', false);
        }

        async function loadMessages() {
            const chatWindow = document.getElementById('chatWindow');
            
            let query = _supabase.from('messages').select('*').order('created_at', { ascending: true });
            
            if (otherUserId === 'system_hoppon') {
                query = query.is('sender_id', null).eq('receiver_id', myUserId);
            } else {
                query = query.or(`and(sender_id.eq.${myUserId},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${myUserId})`);
            }

            const { data: messages, error } = await query;
            
            if (error) {
                chatWindow.innerHTML = `<div class="loading-chat" style="color:red;">Kunne ikke hente beskeder.</div>`;
                return;
            }

            chatWindow.innerHTML = '';

            if (messages.length === 0) {
                chatWindow.innerHTML = `<div class="loading-chat">Skriv den første besked 👋</div>`;
            } else {
                messages.forEach(msg => {
                    const isMe = msg.sender_id === myUserId;
                    appendMessageToUI(msg.content, msg.created_at, isMe);
                });
            }
            scrollToBottom();
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const btn = document.getElementById('sendBtn');
            const text = input.value.trim();

            if (!text || otherUserId === 'system_hoppon') return;

            input.disabled = true;
            btn.disabled = true;

            const newMsg = {
                sender_id: myUserId,
                receiver_id: otherUserId,
                ride_id: rideId || null,
                content: text,
                is_read: false
            };

            appendMessageToUI(text, new Date().toISOString(), true);
            
            input.value = '';
            input.style.height = 'auto';
            scrollToBottom();

            const { error } = await _supabase.from('messages').insert(newMsg);
            
            input.disabled = false;
            btn.disabled = false;
            input.focus();

            if (error) {
                alert("Der skete en fejl: Beskeden blev ikke sendt.");
            }
        }

        function appendMessageToUI(content, timestamp, isMe) {
            const chatWindow = document.getElementById('chatWindow');
            
            if (chatWindow.innerHTML.includes('Skriv den første besked')) {
                chatWindow.innerHTML = '';
            }

            const safeContent = escapeHTML(content).replace(/\n/g, '<br>');
            
            // Sikrer korrekt UTC parsing
            let safeTimestamp = timestamp;
            if (!safeTimestamp.includes('Z') && !safeTimestamp.includes('+')) safeTimestamp += 'Z';
            const timeStr = new Date(safeTimestamp).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });

            const div = document.createElement('div');
            div.className = `msg-wrapper ${isMe ? 'me' : 'other'}`;
            div.innerHTML = `
                <div class="msg-bubble">${safeContent}</div>
                <div class="msg-time">${timeStr}</div>
            `;
            
            chatWindow.appendChild(div);
        }

        function scrollToBottom() {
            const chatWindow = document.getElementById('chatWindow');
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function autoGrow(element) {
            element.style.height = "5px";
            element.style.height = (element.scrollHeight) + "px";
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }
    </script>
</body>
</html>
